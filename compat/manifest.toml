# README.md:63,69 tell the reader to download model_ir_se50.pth and export
# FACE_ID_MODEL_PATH before inference, which reads as an inference
# dependency. It is not: eval/tools/face_id.py:55 is the only reader in the
# tree, so it is a METRIC. Verified rather than taken from the install steps.
face_id_model_is_eval_only = true
kind = "whole_reference"
preprocess = "rgb_only"
exif_transpose = false
note_setup = "eval/tools/face_utils/face.py:29 resize_image(max_size=1024) is evaluation-side"

[[consumers]]
id = "id_v2v"
family = "temporal_control"
repo = "https://github.com/Eyeline-Labs/ID-V2V.git"
commit = "33dd047835cf03a41d7ca6f3a93508946ad6b4d9"
entrypoint = "scripts/preprocess.sh::preprocess"
also_read = [
  "scripts/idv2v_with_normal_depth/preprocess_with_depth.sh",
  "checkpoints/README.md",
]
boundary = ["orig_pixel_mp4", "david_normal_mp4", "depth_mp4"]
retained = ["source_video", "control_stream"]
rebuilt = []
# CONFIRMED against README.md:190-193 (the variants table) and README.md:201,
# which states the two checkpoints are "different, non-interchangeable weights
# with the same architecture, so loading the wrong .pth into a script does not
# error -- it silently produces poor output".
#
# THIRD control mode, from README.md:176: relighting uses NO preprocessing at
# all -- "no SAM3 mask, no grayed-out background, and no preprocessing at
# all. The raw source video is used as the control." So for that documented
# use case the retained source video IS the control stream and nothing
# derived is required.
control_modes = ["orig_pixel_from_sam3", "orig_pixel_plus_normals_plus_depth", "raw_source_video_relighting"]
claim = "Two non-interchangeable checkpoints. idv2v.pth consumes ONE VACE condition, orig_pixel.mp4 from SAM3. idv2v_with_normal_depth.pth consumes THREE: orig_pixel.mp4, david_normal.mp4 (DAViD), depth.mp4 (DepthAnything-V2). Each stream is per-frame and keyed to the source media, not to a face."
status = "unproven"

# Which producer writes each stream, and under which variant. Named per
# stream because the retention question is per stream: re-deriving depth
# costs a DepthAnything-V2 pass over every frame, and re-deriving normals
# costs a DAViD pass, whatever the other two cost.
[consumers.control_streams]
cited = [
  "scripts/preprocess.sh:57-62 orig_pixel",
  "scripts/idv2v_with_normal_depth/preprocess_with_depth.sh:64-75 david + depth",
  "checkpoints/README.md ID-V2V checkpoints table",
]
orig_pixel_mp4 = { producer = "sam3", variants = ["idv2v", "idv2v_with_normal_depth"], prompt = "person" }
david_normal_mp4 = { producer = "david", variants = ["idv2v_with_normal_depth"] }
depth_mp4 = { producer = "depth_anything_v2", variants = ["idv2v_with_normal_depth"] }

[[consumers]]
id = "id_lora"
family = "audio_identity"
repo = "https://github.com/ID-LoRA/ID-LoRA.git"
commit = "13dc9c286a2d3c1a21a7781f9ac0fe7727ec56cd"
entrypoint = "comfy_extras/nodes_lt.py::LTXVReferenceAudio.execute"
entrypoint_in = "comfyui"
dependencies = ["comfyui"]
boundary = ["ref_tokens"]
retained = ["audio_waveform", "audio_sample_rate"]
rebuilt = ["ref_tokens"]
constraint = "~5s; resampled to audio_vae.audio_sample_rate, default 44100"
# nodes_lt.py:867 -- "~5 seconds recommended (training duration). Shorter
# or longer clips may degrade voice identity transfer."
# nodes_lt.py:883-888 -- the reference is RESAMPLED to the audio VAE's
# audio_sample_rate (default 44100) when it differs, which is why the
# stored sample rate is load-bearing rather than metadata.
reference_seconds_recommended = 5
vae_audio_sample_rate_default = 44100
claim = "the latents are the consumer's VAE output and must NOT be stored -- the durable artifact is the waveform, exactly as pixels are durable and crops are not"
status = "unproven"
