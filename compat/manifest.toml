# NOT insightface at this pin. The same buffalo_l onnx files
# (analyzer.py:22-26) run through ReActor's OWN model classes
# (reactor_core.inswap), and the vendor states the results differ
# (README.md:55). MEASURED on one corpus photograph, same weights:
#   bbox, kps, det_score, gender, age  byte-identical
#   embedding                          max |delta| 3.0e-3, float32 both
#   landmark_2d_106                    max |delta| 271.55, float64 vs float32
#   landmark_3d_68                     max |delta| 748.94, float64 vs float32
#   pose                               max |delta| 6.45
# So a landmark_2d_106 / landmark_3d_68 / pose stored from insightface CANNOT
# serve this consumer -- the coordinates are not in the same space -- while
# bbox/kps/det_score/gender/age can, and the embedding is close but not equal.
