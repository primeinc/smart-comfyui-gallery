# The frozen consumer population, pinned.
#
# Every consumer here names the symbol that was READ, at the commit named here.
# Nothing in this file asserts a replay works: `status` is `unproven` until a
# runner executes and writes evidence, and `unclassified` where the contract
# has not been established yet. The harness FAILS while any member is
# unclassified, so adding a row is a commitment to prove it.
#
# TOML, not YAML: `tomllib` is stdlib from 3.11, so the manifest parses with a
# real parser and no dependency. This tree forbids regex-parsing a structured
# format, and a harness about proof should not begin by guessing at its own
# input.
#
# Lives outside the application import graph on purpose. These upstreams pull
# torch, onnxruntime, insightface, facexlib and diffusers; none of that may
# reach `db/` or `sg_web/`.
#
# The boundary is always the EARLIEST deterministic consumer output, never a
# generated image: sampling is nondeterministic across machines and would turn
# a storage proof into a GPU lottery.

version = 1
recorded_at = "2026-08-28"
refs_root = "../refs"          # relative to the repository root

[equivalence]
# Default comparison for tensor boundaries. A runner may NARROW this; widening
# it requires an `equivalence` block on the runner naming the first stage at
# which exactness is lost and why.
method = "exact_bytes"

[equivalence.fallback]
method = "allclose"
rtol = 0.0
atol = 1e-6
why = "Permitted only where the same op runs on a device with unfixed reduction order."

# --- shared upstreams -------------------------------------------------------
# Named once, referenced by key. A dependency that participates in
# preprocessing or conditioning belongs here, not in prose.

[upstreams.insightface]
repo = "https://github.com/deepinsight/insightface.git"
commit = "7fadd420c2351d0ffa8cac403421c1a3ed733365"
read = [
  "python-package/insightface/utils/face_align.py::norm_crop",
  "python-package/insightface/model_zoo/landmark.py::Landmark.get",
  "python-package/insightface/app/common.py::Face.sex",
]
notes = [
  "arcface_dst is a 112 template; estimate_norm asserts size%112==0 OR size%128==0, and the 128 branch adds diff_x = 8.0*ratio -- so 256 is NOT a scaled 224. Three alignment families, not one.",
  "pose is ordered [pitch, yaw, roll]; require_pose is gated on output_shape[1]==3309, i.e. the 1k3d68 head.",
  "Face.sex derives from gender; normed_embedding is a property computed on access, never stored.",
]

[upstreams.facexlib]
repo = "https://github.com/xinntao/facexlib.git"
commit = "260620ae93990a300f4b16448df9bb459f1caba9"
version = "0.3.0"
read = ["facexlib/utils/face_restoration_helper.py::FaceRestoreHelper.align_warp_face"]
notes = [
  "FFHQ-512 template, cv2.estimateAffinePartial2D with LMEDS, gray border (135,133,132).",
  "Landmarks come from its OWN retinaface_resnet50 detector, not from insightface kps.",
  "get_inverse_affine already exists -- that is the mechanism for a source-space footprint.",
]
unpinned_by_consumers = ["pulid_comfyui", "consisid", "infiniteyou"]

[upstreams.diffusers]
repo = "https://github.com/huggingface/diffusers.git"
commit = "c1bf18c92c6285334adcaac7e75ef8946a227f49"

[upstreams.comfyui]
repo = "https://github.com/Comfy-Org/ComfyUI.git"
commit = "a9ab2b62dac17743c62fc1cab8468340496d302e"

# --- runtimes: what the interpreter will actually import --------------------
# Some consumers run from an INSTALLED wheel rather than from the clone, and a
# wheel is not automatically the commit it claims. Each row names a file that
# exists in both places; `provenance.py` hashes the installed bytes against
# `git show <commit>:<path>` and fails when they diverge.
#
# Without this the suite could cite a commit and execute something else, which
# is the most expensive kind of wrong evidence -- it looks fully sourced.
# Installed through `uv sync --group compat`; the group is NOT in
# `default-groups`, so the application's environment never carries it.

[[runtimes]]
package = "facexlib"
upstream = "facexlib"
path = "facexlib/utils/face_restoration_helper.py"
installed_path = "facexlib/utils/face_restoration_helper.py"

[[runtimes]]
package = "diffusers"
upstream = "diffusers"
path = "src/diffusers/pipelines/consisid/consisid_utils.py"
installed_path = "diffusers/pipelines/consisid/consisid_utils.py"

[[runtimes]]
package = "insightface"
upstream = "insightface"
path = "python-package/insightface/utils/face_align.py"
installed_path = "insightface/utils/face_align.py"

# --- weights: what actually computed the numbers ----------------------------
# Pinning twenty repositories to the commit and leaving the model files
# unnamed would let this suite reproduce its own code exactly and still
# produce different embeddings on another machine, with nothing in the record
# able to explain it. These are hashed by content on every provenance run.
#
# Not vendored and not downloadable from here: `vision/weights.py` owns
# provisioning, and the licence is non-commercial research
# (deepinsight/insightface). A missing file makes cases UNSUPPORTED, which is
# the honest outcome, and stays visible in the evidence.

[[weights]]
pack = "antelopev2"
root = "C:/ComfyUI/output/.AImodels/insightface/models/antelopev2"
file = "glintr100.onnx"
role = "recognition -- the 512-d embedding every identity claim rests on"

[[weights]]
pack = "antelopev2"
root = "C:/ComfyUI/output/.AImodels/insightface/models/antelopev2"
file = "scrfd_10g_bnkps.onnx"
role = "detection -- bbox, det_score and the 5 keypoints the whole arcface family aligns on"

[[weights]]
pack = "antelopev2"
root = "C:/ComfyUI/output/.AImodels/insightface/models/antelopev2"
file = "1k3d68.onnx"
role = "landmark_3d_68, and pose is derived from its output rather than emitted separately"

[[weights]]
pack = "antelopev2"
root = "C:/ComfyUI/output/.AImodels/insightface/models/antelopev2"
file = "2d106det.onnx"
role = "landmark_2d_106 -- 848 bytes per face, the second-largest retained candidate"

[[weights]]
pack = "antelopev2"
root = "C:/ComfyUI/output/.AImodels/insightface/models/antelopev2"
file = "genderage.onnx"
role = "gender and age; not derivable from anything else the pass returns"

# buffalo_l: insightface's DEFAULT_MP_NAME. UniPortrait constructs
# FaceAnalysis with no name=, so it gets THIS pack -- det_10g + w600k_r50,
# different files from antelopev2's scrfd_10g_bnkps + glintr100. Different
# detector means different keypoints, so antelopev2 kps cannot serve it.

[[weights]]
pack = "buffalo_l"
root = "C:/ComfyUI/output/.AImodels/insightface/models/buffalo_l"
file = "det_10g.onnx"
role = "detection for UniPortrait; NOT the same detector as antelopev2"

[[weights]]
pack = "buffalo_l"
root = "C:/ComfyUI/output/.AImodels/insightface/models/buffalo_l"
file = "w600k_r50.onnx"
role = "buffalo_l recognition; a third embedding space alongside glintr100 and facexlib arcface"

# facexlib's own weights. PuLID, ConsisID and InfiniteYou re-detect with
# retinaface_resnet50 rather than reusing insightface keypoints, and
# InfiniteYou's embedding is facexlib's arcface -- not glintr100 at all.
# Downloaded by facexlib itself into its package directory.

[[weights]]
pack = "facexlib"
root = "C:/Users/will/dev/smart-comfyui-gallery/.venv/Lib/site-packages/facexlib/weights"
file = "detection_Resnet50_Final.pth"
role = "retinaface_resnet50 -- the detector in the loop for PuLID/ConsisID/InfiniteYou"

[[weights]]
pack = "facexlib"
root = "C:/Users/will/dev/smart-comfyui-gallery/.venv/Lib/site-packages/facexlib/weights"
file = "recognition_arcface_ir_se50.pth"
role = "InfiniteYou's embedding model; a DIFFERENT 512-d space from glintr100"

[[weights]]
pack = "facexlib"
root = "C:/Users/will/dev/smart-comfyui-gallery/.venv/Lib/site-packages/facexlib/weights"
file = "parsing_bisenet.pth"
role = "face parsing for PuLID/ConsisID masked crops"

