  "ComfyUI-ReActor@6ad6b35a4df2 README.md:175 and :220 link these two workflows.",
  "v2 workflow: four LoadImage nodes -> ImpactMakeImageBatch -> ReActorBuildFaceModel widgets [True, True, 'test', 'Mean'].",
  "Its Note node states the combine options: Mean (average, recommended), Median (mid-point), Mode (most common). ReActor AVERAGES N face models; PhotoMaker stacks them.",
  "The four LoadImage targets are not distributed in any Gourieff repository, so ReActor has an entrypoint but no first-party input media.",
