# The frozen consumer population, pinned.
#
# Every consumer here names the symbol that was READ, at the commit named here.
# Nothing in this file asserts a replay works: `status` is `unproven` until a
# runner executes and writes evidence, and `unclassified` where the contract
# has not been established yet. The harness FAILS while any member is
# unclassified, so adding a row is a commitment to prove it.
#
# TOML, not YAML: `tomllib` is stdlib from 3.11, so the manifest parses with a
# real parser and no dependency. This tree forbids regex-parsing a structured
# format, and a harness about proof should not begin by guessing at its own
# input.
#
# Lives outside the application import graph on purpose. These upstreams pull
# torch, onnxruntime, insightface, facexlib and diffusers; none of that may
# reach `db/` or `sg_web/`.
#
# The boundary is always the EARLIEST deterministic consumer output, never a
# generated image: sampling is nondeterministic across machines and would turn
# a storage proof into a GPU lottery.

version = 1
recorded_at = "2026-08-28"
refs_root = "../refs"          # relative to the repository root

[equivalence]
# Default comparison for tensor boundaries. A runner may NARROW this; widening
# it requires an `equivalence` block on the runner naming the first stage at
# which exactness is lost and why.
method = "exact_bytes"

[equivalence.fallback]
method = "allclose"
rtol = 0.0
atol = 1e-6
why = "Permitted only where the same op runs on a device with unfixed reduction order."

# --- shared upstreams -------------------------------------------------------
# Named once, referenced by key. A dependency that participates in
# preprocessing or conditioning belongs here, not in prose.

[upstreams.insightface]
repo = "https://github.com/deepinsight/insightface.git"
commit = "7fadd420c2351d0ffa8cac403421c1a3ed733365"
read = [
  "python-package/insightface/utils/face_align.py::norm_crop",
  "python-package/insightface/model_zoo/landmark.py::Landmark.get",
  "python-package/insightface/app/common.py::Face.sex",
]
notes = [
  "arcface_dst is a 112 template; estimate_norm asserts size%112==0 OR size%128==0, and the 128 branch adds diff_x = 8.0*ratio -- so 256 is NOT a scaled 224. Three alignment families, not one.",
  "pose is ordered [pitch, yaw, roll]; require_pose is gated on output_shape[1]==3309, i.e. the 1k3d68 head.",
  "Face.sex derives from gender; normed_embedding is a property computed on access, never stored.",
]

[upstreams.facexlib]
repo = "https://github.com/xinntao/facexlib.git"
commit = "260620ae93990a300f4b16448df9bb459f1caba9"
version = "0.3.0"
read = ["facexlib/utils/face_restoration_helper.py::FaceRestoreHelper.align_warp_face"]
notes = [
  "FFHQ-512 template, cv2.estimateAffinePartial2D with LMEDS, gray border (135,133,132).",
  "Landmarks come from its OWN retinaface_resnet50 detector, not from insightface kps.",
  "get_inverse_affine already exists -- that is the mechanism for a source-space footprint.",
]
unpinned_by_consumers = ["pulid_comfyui", "consisid", "infiniteyou"]

[upstreams.diffusers]
repo = "https://github.com/huggingface/diffusers.git"
commit = "c1bf18c92c6285334adcaac7e75ef8946a227f49"

[upstreams.comfyui]
repo = "https://github.com/Comfy-Org/ComfyUI.git"
commit = "a9ab2b62dac17743c62fc1cab8468340496d302e"

