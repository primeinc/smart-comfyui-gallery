# Git hooks, so the gates run without anybody remembering to run them --
# and so no gate re-derives a proof that already exists.
#
# Verification scope follows change scope, and the full proof runs once,
# outside anybody's write path:
#
#   per commit   `just check`       lint, format, types over both
#                                   languages, web unit
#   per commit   `just test`        the fast lane: everything that does
#                                   not drive a browser, boot a server or
#                                   open a database
#   per push     `just prove-push`  an already-proven tree exits at once;
#                                   otherwise the testmon-selected slice
#   the proof    `just prove`       check-deep + the whole suite; on green
#                                   it records the tree hash in
#                                   .proven-tree, which is what lets a
#                                   push skip
#
# `just check` does NOT depend on `just test`, so the per-commit tier
# needs both named here. A check that exists but is unreachable from the
# hook is not a check. `just budget` holds each lane to its own clock.
#
# `LEFTHOOK=0 git commit` skips, deliberately and visibly.
#
# The per-commit gate is on commit-msg, not pre-commit.
#
# On `pre-commit`, lefthook reverts the working tree, runs the jobs against
# the staged content, and restores afterwards. On success it prints nothing.
#
# The mechanism, lefthook v2.1.10 (evilmartians/lefthook, tag v2.1.10,
# 8d9cfec5f52367af6374a5430b4e9568844856e5),
# internal/run/controller/controller.go, the newGuard call in RunHook:
#
#     newGuard(
#         c.git, c.logger, c.filesToStage,
#         !opts.NoStageFixed && config.HookUsesStagedFiles(hook.Name),
#         opts.FailOnChanges, opts.FailOnChangesDiff,
#     )
#
# That fourth argument is the guard's `stashUnstagedChanges`. In guard.go,
# `withHiddenUnstagedChanges`: when it is true AND `PartiallyStagedFiles()`
# is non-empty, the guard saves the unstaged changes, REVERTS them, runs the
# hook, then restores -- and if `CanRestoreUnstagedChanges()` is false it
# reverts everything and returns errRestorationConflict.
#
# So the trigger is the HOOK NAME, via `HookUsesStagedFiles(hook.Name)`, and
# the only switch is `opts.NoStageFixed` -- the `--no-stage-fixed` CLI flag
# on `lefthook run` ("ignore 'stage_fixed: true' setting"). It is a FLAG, not
# a config key, and the hook file lefthook generates calls
# `lefthook run "pre-commit" "$@"` with no flag. Config cannot inject one.
#
# And there is no config key for it. lefthook ships its own JSON Schema at
# node_modules/lefthook/schema.json (2.1.10, stamped 2026.07.03), and it is
# CLOSED -- `"additionalProperties": false` on the root and on every one of
# Hook, Job, Group, Command, Script. No `no_stash`, no `stash`, no
# `skip_stash`, no `hide_unstaged`. A `stash: false` here would be REJECTED,
# not ignored. The only stash-adjacent key that exists is `stage_fixed`,
# which does the opposite.
#
# To reproduce: a scratch repo whose worktree holds "four" and whose index
# holds "three" (status `MM`), with one job that is `cat a.txt`. Under
# `pre-commit` the job reads "three"; add `--no-stage-fixed` and it reads
# "four". Nothing is printed either way -- lefthook logs the git command
# only when it errors, so the revert is silent on success.
#
# commit-msg is not in `HookUsesStagedFiles`, so its guard is constructed
# with stashUnstagedChanges=false and the revert cannot happen: by
# construction, with no flag to forget.
#
# The revert buys this repository nothing anyway. It exists so a hook
# reading a partially staged file sees staged content rather than
# staged+unstaged. Every lane in `just check` walks the whole tree --
# `ruff check .`, `ruff format --check .`, `biome lint`, `tsc -p frontend`,
# `ty check`, `pyrefly check` -- and not one takes `{staged_files}`.
#
# It can also deadlock. `git commit -a` holds .git/index.lock, the guard's
# revert needs that same lock, and the hook subtree then sits at zero CPU
# until the parent git is killed, leaving the lock behind so the next
# commit wedges identically.
#
# commit-msg gets the same trigger (every commit, `-m` and `-a` included)
# and aborts the commit identically on non-zero exit.
#
# `prove-push` in the justfile states the same invariant for its own tier:
# "The worktree, not a stash: a gate that moves the developer's files to
# inspect them can lose them." There is no config-only way to hold that on
# `pre-commit`.

min_version: 1.10.0

# What lefthook prints, not what the jobs run. Absent this key the default is
# EVERYTHING: a nil `output` falls to the default arm of NewExecutionLogger
# (internal/logger/execution_logger.go) and enables executionFull, which
# replays every green job's entire captured stdout after the job exits -- as
# ONE console write (internal/run/controller/run.go buffers stdout to a
# bytes.Buffer and prints it whole). A green pre-push slice log is megabytes,
# and on 2026-09-01 that single write into a looping ConPTY host blocked
# `git push` for five hours.
#
# With this list a green job prints the banner, its checkmark and the
# summary, and nothing else. A FAILED job still prints its captured output:
# LogExecution short-circuits the replay only when err == nil
# (internal/logger/execution_logger.go), so red keeps its evidence.
output:
  - meta
  - summary
  - success
  - failure
  - skips

# A missing binary must FAIL, not silently pass. Without this the hook is a
# file that exits 0 when lefthook is not installed, which is the same shape
# as a test lane that collects nothing and exits clean.
assert_lefthook_installed: true

commit-msg:
  # Sequential: `just check` and `just test` each rebuild
  # sg_web/static/build first and `check` runs its own lanes in parallel,
  # so two at once would walk the same directory.
  #
  # Two jobs, not one aggregate recipe: when this goes red the name in the
  # output says which lane failed without reading further.
  piped: true
  jobs:
    - name: gate
      run: just check
      fail_text: "`just check` failed. Fix it or LEFTHOOK=0 to commit anyway."
    - name: fast tests
      run: just test
      fail_text: "`just test` failed. Fix it or LEFTHOOK=0 to commit anyway."

pre-push:
  jobs:
    - name: prove or skip
      run: just prove-push
      fail_text: "the affected slice failed. `just prove` runs and records the whole picture."
