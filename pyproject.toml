# uv-native install path. Mirrors requirements.txt (core) and
# requirements-ai.txt (optional AI layer) -- keep the three in sync.
#
#   uv sync                        core app + test tooling -> ./.venv
#   uv sync --extra ai             + OmniQuery natural-language parsing
#   uv sync --extra ai-models      + real embedding/critic/segmentation
#                                    runtimes (CPU torch; weights are
#                                    provisioned separately, see
#                                    docs/AI_MODELS.md)
#   uv run python smartgallery.py  run the gallery
#   uv run pytest tests/           run the model-free suite

[project]
name = "smartgallery"
version = "0.0.0"
description = "Local-first browser-based DAM for ComfyUI with an optional derived AI layer"
requires-python = ">=3.10"
dependencies = [
    "Flask",
    "Pillow",
    "opencv-python<5",  # 5.x ORT engine needs dynamic-dims ONNX; deployed YuNet 2023mar is static-shape (docs/AUDIT_FACE_INGESTION_2026-08-15.md finding 3)
    "numpy",
    "tqdm",
    "werkzeug",
    "markupsafe",
    "pyOpenSSL",
    "click",
    "itsdangerous",
    "blinker",
    "cryptography",
    "waitress",
    "argon2-cffi",
]

[dependency-groups]
dev = ["pytest"]
# OmniQuery local natural-language parsing + weight provisioning.
ai = [
    "cactus-needle>=2.0.4",
    "faiss-cpu>=1.15",
    "llama-cpp-python>=0.3.0",
    "huggingface_hub",
    "insightface>=1.0.1",  # FaceAnalysis pipeline (SCRFD + glintr100)
    "onnxruntime",
]
# Real model backends: semantic/visual embeddings, the qwen-vl critic's
# grounding gate, and MobileSAM segmentation. torch resolves to CPU wheels
# here; at runtime the auto-provisioner picks CUDA wheels when an NVIDIA
# GPU is present. Weights auto-download on first start (or via
# `python -m smartgallery_ai provision`); see docs/AI_MODELS.md.
ai-models = [
    { include-group = "ai" },
    "torch",
    "torchvision",
    "open_clip_torch",
    "transformers",
    "timm",
    "mobile-sam",
    "num2words",
]

[tool.uv]
# Application, not a distributable package: uv manages the environment but
# never builds/installs the project itself. Batteries included by default:
# plain `uv sync` installs everything (opt out with --no-default-groups or
# --no-group ai-models).
package = false
default-groups = ["dev", "ai", "ai-models"]

[tool.uv.sources]
# torch and torchvision must resolve from the SAME index: a CPU-index torch
# paired with a PyPI torchvision fails at import with
# "operator torchvision::nms does not exist".
# CPU index on purpose: static resolution cannot see GPUs. On CUDA
# hardware the app swaps the pair for CUDA wheels at startup
# (AI_DAM_DEVICE=cpu opts out), so `uv sync` stays lean and safe
# everywhere without costing GPU users anything.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
