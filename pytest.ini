[pytest]
testpaths = tests
addopts = -q
# An application, not an installed package: this is what puts db, sg_web,
# vision and metaparse on sys.path for `uv run pytest` and a bare `pytest`.
pythonpath = .
markers =
    slow: every test in this suite. `just test` and `just check` are held
        to ten seconds each and nothing here fits: each test opens a
        database, serves the application or drives a browser. Applied to
        the whole collection by tests/conftest.py rather than written on
        modules one at a time. Run the suite with `just test-slow`.
# Every warning is a failure: a deprecation is next release's break, a
# ResourceWarning (surfacing at garbage collection as an unraisable) is a
# handle nobody closed, and anything else is a fact somebody meant to read.
filterwarnings =
    error
