[pytest]
testpaths = tests
# -n 8, not auto: the suite is bound by the disk under tmp_path, not the
# CPU -- measured 13.8 s at 8 workers against 16.6 s at 16 on a 16-core
# box. --dist loadfile keeps a module's tests on one worker so its
# module-scoped world (tests/staging.py) is built once.
addopts = -q -n 8 --dist loadfile
# An application, not an installed package: this is what puts db, sg_web,
# vision and metaparse on sys.path for `uv run pytest` and a bare `pytest`.
pythonpath = .
markers =
    slow: a call phase measured over one second -- a real sample library,
        a real timeout, a real migration chain. Not in `just test`; run
        with `just test-slow` or `just check-all`.
filterwarnings =
    ignore::DeprecationWarning
