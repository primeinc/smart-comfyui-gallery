[pytest]
testpaths = tests
# -n auto: every test isolates on tmp_path, so the suite spreads over the
# cores; --dist loadfile keeps a module's tests on one worker so its
# session fixtures are built once.
addopts = -q -n auto --dist loadfile
# The suite imports the monolith by name, and this repo is an application
# rather than an installed package, so nothing else puts the root on
# sys.path. Without this, only invocations that happen to prepend the
# working directory (`python -m pytest`) work; `uv run pytest` and a bare
# `pytest` in an activated venv fail in conftest at `import smartgallery`.
pythonpath = .
markers =
    slow: reads a real sample library or waits out a real timeout (seconds,
        not milliseconds). Always in the gate; skip in a focused run with
        `-m "not slow"`.
filterwarnings =
    ignore::DeprecationWarning
