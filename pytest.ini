[pytest]
testpaths = tests
# -vv, not -q. Verbosity is a COUNTER: `-q` decrements and `-v`
# increments, so a `-q` here silently cancelled a `-v` on the command
# line and printed dots either way. That cost real time twice in one
# session -- once reading a hung fixture as a slow test, once unable to
# name which of 2400 tests was running. The output is longer; knowing
# which test is on screen is worth it.
# Four workers, grouped by module. `loadscope` is load-bearing: a
# module's server is module-scoped (tests/conftest.py `live`), so its
# tests must stay on one worker -- a plain `-n` boots a server per test
# and is SLOWER than serial.
#
# FOUR, and not for the reason previously written here. The old note said
# "Four, not more. Six measured 65.0s, which is the same number", on the
# argument that a module cannot be split so the wall clock cannot go
# below the longest module. The argument is sound and the suite is
# nowhere near that floor; measured now, two runs at each end:
#
#   -n 4    56.0s
#   -n 8    41.7s, 42.7s
#   -n 12   48.4s
#
# Eight really is 25% faster, and it is still four, because the wall
# clock is not the only thing eight workers change.
# tests/test_writes_stay_linear.py asserts a RATIO of per-row cost across
# a fourfold size increase, on the stated grounds that "the gap is wide
# enough that timing noise cannot reach it" -- linear 1.0-1.1x against a
# 2.0 tolerance. At eight workers it reached 2.1x and failed the push.
# Load is exactly the noise that test assumes away.
#
# So the count is capped by the one test that measures a clock, not by
# the scheduler. Making that test read `time.process_time` instead of
# wall time would decouple the two and is the way to eight; until then
# this is four. (`--dist worksteal` is not the lever either -- 58.8s. It
# splits a module across workers and pays for a second server, which is
# what `loadscope` exists to prevent.)
# `-p no:anyio`: anyio ships a pytest plugin too, and it exists to run
# ASYNC tests -- it contributes `anyio_backend` and the `anyio` marker
# and nothing else. There is not one `async def test` in this suite, no
# `pytest.mark.anyio`, and no mention of it in pytest.ini or the
# justfile; the library itself arrives under litestar and httpx and is
# untouched by this, which only declines to load the plugin. Measured by
# disabling one plugin at a time against `--collect-only`, it is ~111 ms
# of a 968 ms collect; on the wall clock,
# test_a_table_column_orders_the_answer 1085/1132 ms -> 1014/1029/1037 ms.
#
# `-p no:pytest-testmon`: ~99 ms, and exactly one lane uses it --
# `just prove-push`, which now says `-p pytest-testmon` to turn it back
# on. An explicit `-p` overrides a `-p no:` here; that was verified, not
# assumed, by checking the run still prints testmon's own
# `changed files: ..., unchanged files: N` header. A plugin that parses
# its flag and silently selects nothing would be the bad outcome, so the
# header is the thing to look at rather than the exit code.
#
# The other three auto-loaded plugins stay, and it is worth saying why so
# nobody re-measures them: xdist serves `-n 4` above, base_url is
# pytest-playwright's own dependency, and playwright drives the browser
# modules -- which run this same command, so it cannot be moved to a lane.
#
# `-p no:faker`: Faker ships a pytest plugin
# (`faker.contrib.pytest.plugin`), pytest loads every installed plugin at
# startup, and importing it is 274 ms -- more than pytest's own 191 ms.
# Nothing in this repository mentions faker; it arrives as somebody
# else's dependency and offers a `faker` fixture no test asks for. That
# cost is paid once per pytest PROCESS, which is once per module when
# the suite is read one module at a time, and most of it is invisible in
# `--durations`: pytest's clock starts after plugins load. Measured on
# the wall clock: test_a_table_column_orders_the_answer 1537 ms ->
# 1085/1132 ms, test_a_term_is_a_reading_not_an_identity 1653 ms ->
# 1044/1066 ms. Its reported time fell with it (0.29 s -> 0.16 s), so
# part of that cost was fixture registration inside the window as well.
addopts = -vv -n 4 --dist loadscope -p no:faker -p no:anyio -p no:pytest-testmon
# An application, not an installed package: this is what puts db, sg_web,
# vision and metaparse on sys.path for `uv run pytest` and a bare `pytest`.
pythonpath = .
markers =
    slow: this test drives a browser, boots a `live` server, or opens a
        database. Applied by tests/conftest.py from the test's own fixture
        closure (SLOW_FIXTURES) rather than written on modules one at a
        time, so a test is marked the moment it asks for a page or a
        database. Run the marked set with `just test-slow`; `just test`
        runs the rest.
    expects_broken: this browser test PROVOKES a first-party failure, so
        `unbroken` (autouse for anything driving a browser) must not fail
        it. A sentence in the test rather than the silence of never
        having asked for the check -- which is what nine browser tests
        had, four of them over the timeline.
# Every warning is a failure: a deprecation is next release's break, a
# ResourceWarning (surfacing at garbage collection as an unraisable) is a
# handle nobody closed, and anything else is a fact somebody meant to read.
filterwarnings =
    error
