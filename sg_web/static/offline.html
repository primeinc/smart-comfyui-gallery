<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steadfast — offline</title>
  <!-- This page is served from the service worker's cache when the
       server is unreachable, so it owns its whole head and inlines its
       icon: a <link> onto /static would be another request that just
       failed. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314151a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%23e8e6df'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d8a24a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23e8e6df' opacity='0.55'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%23e8e6df' opacity='0.8'/%3E%3C/svg%3E">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #14151a; color: #e8e6df;
           font: 16px/1.5 system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.2rem; font-weight: 600; }
    p { color: #9a978d; }
    a { color: #d8a24a; }
  </style>
</head>
<body>
  <main>
    <h1>Steadfast is unreachable</h1>
    <p>The library lives on its server and nothing here is cached without it.
       <a href="/g">Try again</a> once the server is back.</p>
  </main>
</body>
</html>
