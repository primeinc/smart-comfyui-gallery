<h2>media roots</h2>
{% if notice %}<p id="operations-notice" class="operations-notice" data-operations-notice hx-swap-oob="true"><span data-notice>{{ notice }}</span></p>{% endif %}
{% if roots %}
<ul class="operations-roots">
  {% for root in roots %}
  <li data-root="{{ root.id }}" data-online="{{ 'yes' if root.online else 'no' }}">
    <code>{{ root.path }}</code>
    <span class="root-state">{{ 'online' if root.online else 'offline' }}</span>
    <button type="button" data-scan="{{ root.id }}"
            hx-post="/operations/roots/{{ root.id }}/scan" hx-target="#operations-roots" hx-swap="innerHTML">scan</button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">no media directories registered yet.</p>
{% endif %}
<form class="operations-form" data-add-root hx-post="/operations/roots" hx-target="#operations-roots" hx-swap="innerHTML">
  <input name="path" placeholder="D:/pictures" aria-label="directory path" required>
  <select name="kind" aria-label="kind">
    <option value="library">library</option>
    <option value="mount">mount</option>
  </select>
  <button type="submit">add root</button>
</form>
