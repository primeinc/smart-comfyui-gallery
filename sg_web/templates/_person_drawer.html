<div class="drawer" data-drawer data-slug="{{ person.slug }}" role="dialog"
     aria-label="{{ person.name or '(unnamed)' }}">
  <button class="lightbox-close" data-close aria-label="close">&times;</button>
  <div class="drawer-hero">
    <img class="person-face person-face-big" src="/avatar/{{ person.slug }}" alt="">
    <div>
      <h2>{{ person.name or "(unnamed)" }}</h2>
      <p class="person-count">{{ person.count }} pictures</p>
      <a data-full href="/p/{{ person.slug }}">open full profile</a>
    </div>
  </div>
  <form class="person-rename" data-rename action="/p/{{ person.slug }}/name" method="post">
    <input name="name" placeholder="{{ 'rename' if person.name else 'give them a name' }}"
           aria-label="name" required>
    <button type="submit">name</button>
  </form>
  <div class="drawer-strip">
    {% for pic in person.pictures[:9] %}
    <a href="/i/{{ pic.slug }}"><img src="/thumb/{{ pic.slug }}" alt="{{ pic.name }}" loading="lazy"></a>
    {% endfor %}
  </div>
</div>
