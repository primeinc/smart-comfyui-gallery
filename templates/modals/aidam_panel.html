<!-- AI DAM PANEL: Similar / Faces / Review (WI-31 wave 3) -->
<!-- Version: 2.22 - August 12, 2026 -->
<!-- Self-contained lightbox overlay for the optional derived-AI layer. Every
     fetch here hits /galleryout/api/aidam/* (see smartgallery_ai/service.py),
     which always no-ops to {"enabled": false} when the AI layer is off --
     this file just has to render that gracefully. Included only when
     enable_ai_dam is true (see index.html). -->

<style>
    #aidam-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:10550; display:none; justify-content:center; align-items:center; opacity:0; transition:opacity 0.2s; }
    .aidam-panel-card { background:var(--surface-color); border:1px solid var(--ai-color); border-radius:16px; width:820px; max-width:95vw; height:82vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.9); overflow:hidden; }
    .aidam-header-container { padding:15px 20px; background:var(--surface-hover); border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
    .aidam-tabbar { display:flex; gap:6px; padding:10px 20px 0 20px; background:var(--surface-hover); border-bottom:1px solid var(--border-color); flex-shrink:0; }
    .aidam-tab-btn { background:transparent; border:none; border-bottom:3px solid transparent; color:var(--text-muted); padding:10px 14px; font-size:0.9rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; border-radius:6px 6px 0 0; transition:all 0.15s ease; }
    .aidam-tab-btn:hover { color:#fff; background:rgba(255,255,255,0.06); }
    .aidam-tab-btn.aidam-tab-active { color:#fff; border-bottom-color:var(--ai-color); background:rgba(255,0,255,0.08); }
    .aidam-body { flex:1; min-height:0; padding:20px; overflow-y:auto; box-sizing:border-box; }
    .aidam-tab-panel { display:none; flex-direction:column; }

    .aidam-toggle-group { display:inline-flex; border:1px solid #444; border-radius:8px; overflow:hidden; margin-bottom:14px; }
    .aidam-toggle-btn { background:#111; color:var(--text-muted); border:none; padding:6px 16px; font-size:0.85rem; font-weight:600; cursor:pointer; }
    .aidam-toggle-btn.aidam-toggle-active { background:var(--ai-color); color:#1a001a; }

    .aidam-section-title { color:var(--text-muted); font-weight:800; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; margin:20px 0 10px 0; display:block; }

    .aidam-thumb-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
    .aidam-thumb-card { position:relative; cursor:pointer; border-radius:8px; overflow:hidden; background:#111; border:1px solid #333; aspect-ratio:1/1; transition:border-color 0.15s; }
    .aidam-thumb-card:hover { border-color:var(--ai-color); }
    .aidam-thumb-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .aidam-thumb-score { position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,0.75); color:#fff; font-size:0.7rem; padding:1px 6px; border-radius:4px; }
    .aidam-badge-exact { position:absolute; top:4px; right:4px; background:var(--danger-color); color:#fff; font-size:0.65rem; font-weight:bold; text-transform:uppercase; padding:1px 6px; border-radius:4px; }
    .aidam-badge-near { position:absolute; top:4px; right:4px; background:#e67e22; color:#fff; font-size:0.65rem; font-weight:bold; padding:1px 6px; border-radius:4px; }

    .aidam-status-msg { padding:24px 16px; text-align:center; color:var(--text-muted); font-size:0.9rem; background:rgba(255,255,255,0.03); border:1px dashed #444; border-radius:10px; }
    .aidam-status-error { color:#ff6b6b; border-color:#e74c3c; background:rgba(231,76,60,0.1); }

    .aidam-preview-wrap { position:relative; width:100%; max-width:380px; margin:0 auto 16px auto; border-radius:10px; overflow:hidden; background:#000; }
    .aidam-preview-wrap img { width:100%; display:block; }
    .aidam-bbox { position:absolute; border:2px solid; border-radius:2px; pointer-events:none; box-shadow:0 0 6px rgba(0,0,0,0.6); }

    .aidam-face-list { display:flex; flex-direction:column; gap:6px; }
    .aidam-face-row { display:flex; align-items:center; gap:10px; background:#151515; border:1px solid #333; border-radius:8px; padding:8px 12px; font-size:0.85rem; color:#ddd; }
    .aidam-face-swatch { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

    .aidam-cluster-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; }
    .aidam-cluster-card { cursor:pointer; background:#151515; border:1px solid #333; border-radius:10px; overflow:hidden; text-align:center; transition:border-color 0.15s; }
    .aidam-cluster-card:hover { border-color:var(--ai-color); }
    .aidam-cluster-card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
    .aidam-cluster-noimg { width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:2rem; background:#0d0d0d; }
    .aidam-cluster-label { color:#fff; font-size:0.8rem; font-weight:600; padding:6px 6px 0 6px; word-break:break-word; }
    .aidam-cluster-size { color:var(--text-muted); font-size:0.72rem; padding:2px 6px 8px 6px; }

    .aidam-meter-row { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
    .aidam-meter-label { display:flex; justify-content:space-between; font-size:0.82rem; color:#ddd; margin-bottom:4px; }
    .aidam-meter-track { width:100%; height:8px; border-radius:5px; background:#222; overflow:hidden; }
    .aidam-meter-fill { height:100%; background:linear-gradient(90deg, var(--ai-color), #9b59b6); border-radius:5px; }

    .aidam-findings-list { display:flex; flex-direction:column; gap:8px; }
    .aidam-finding-row { display:flex; align-items:flex-start; gap:10px; background:#151515; border:1px solid #333; border-radius:8px; padding:10px 12px; }
    .aidam-finding-body { flex:1; min-width:0; }
    .aidam-finding-type { color:#fff; font-size:0.88rem; font-weight:700; text-transform:capitalize; }
    .aidam-finding-desc { color:#bbb; font-size:0.8rem; margin-top:3px; }
    .aidam-chip { border:1px solid; padding:2px 9px; border-radius:10px; font-size:0.7rem; font-weight:800; text-transform:uppercase; flex-shrink:0; }
    .aidam-chip-global { border:1px solid #555; color:var(--text-muted); padding:2px 9px; border-radius:10px; font-size:0.7rem; font-weight:700; text-transform:uppercase; flex-shrink:0; }
    .aidam-mask-toggle-btn { background:rgba(255,0,255,0.12); border:1px solid var(--ai-color); color:var(--ai-color); border-radius:8px; padding:4px 10px; font-size:0.75rem; font-weight:700; cursor:pointer; flex-shrink:0; white-space:nowrap; }

    @media (max-width: 650px) {
        .aidam-panel-card { height:92vh; }
        .aidam-header-container h3 { font-size:1.05rem !important; }
    }
</style>

<div id="aidam-overlay">
    <div class="aidam-panel-card" onclick="event.stopPropagation();">

        <!-- Header -->
        <div class="aidam-header-container">
            <h3 style="margin:0; font-size:1.25rem; color:white; display:flex; align-items:center; gap:10px;">🧬 AI DAM <span style="font-size:0.75rem; background:var(--ai-color); color:#1a001a; padding:2px 6px; border-radius:4px;">Similar &middot; Faces &middot; Review &middot; Status</span></h3>
            <button onclick="closeAidamPanel()" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>

        <!-- Tab Bar -->
        <div class="aidam-tabbar">
            <button type="button" id="aidam-tab-btn-similar" class="aidam-tab-btn aidam-tab-active" onclick="aidamSwitchTab('similar')">🧭 Similar</button>
            <button type="button" id="aidam-tab-btn-faces" class="aidam-tab-btn" onclick="aidamSwitchTab('faces')">🙂 Faces</button>
            <button type="button" id="aidam-tab-btn-review" class="aidam-tab-btn" onclick="aidamSwitchTab('review')">🩺 Review</button>
            <button type="button" id="aidam-tab-btn-search" class="aidam-tab-btn" onclick="aidamSwitchTab('search')">🔎 Search</button>
            <button type="button" id="aidam-tab-btn-status" class="aidam-tab-btn" onclick="aidamSwitchTab('status')">📊 Status</button>
        </div>

        <!-- Body -->
        <div class="aidam-body">

            <!-- SIMILAR TAB (global mode: gallery-wide duplicate sweep) -->
            <div id="aidam-tab-similar" class="aidam-tab-panel" style="display:flex;">
                <div class="aidam-toggle-group" id="aidam-similar-chrome-toggle">
                    <button type="button" id="aidam-space-semantic-btn" class="aidam-toggle-btn aidam-toggle-active" onclick="aidamSetSimilarSpace('semantic')">Semantic</button>
                    <button type="button" id="aidam-space-visual-btn" class="aidam-toggle-btn" onclick="aidamSetSimilarSpace('visual')">Visual</button>
                </div>
                <div id="aidam-similar-content"></div>

                <span class="aidam-section-title" id="aidam-similar-chrome-dup-title">Duplicates</span>
                <div id="aidam-duplicates-content"></div>
            </div>

            <!-- FACES TAB -->
            <div id="aidam-tab-faces" class="aidam-tab-panel">
                <div id="aidam-faces-content"></div>
            </div>

            <!-- REVIEW TAB -->
            <div id="aidam-tab-review" class="aidam-tab-panel">
                <div id="aidam-review-content"></div>
            </div>

            <!-- SEARCH TAB: free-text semantic image search (gallery-wide) -->
            <div id="aidam-tab-search" class="aidam-tab-panel">
                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <input type="search" id="aidam-search-input" placeholder="Describe what you're looking for — e.g. 'a red car at night'"
                           style="flex:1; background:#111; border:1px solid #444; border-radius:8px; color:#fff; padding:8px 12px; font-size:0.9rem;"
                           onkeydown="if (event.key === 'Enter') aidamRunSemanticSearch();">
                    <button type="button" class="glass-btn" style="padding:8px 16px;" onclick="aidamRunSemanticSearch()">🔎 Search</button>
                </div>
                <div id="aidam-search-content"></div>
            </div>

            <!-- STATUS TAB: live ingest/backlog dashboard -->
            <div id="aidam-tab-status" class="aidam-tab-panel">
                <div id="aidam-status-content"></div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- AI DAM PANEL STATE (all functions prefixed `aidam`) ---
    let aidamCurrentFileId = null;
    let aidamSimilarSpace = 'semantic';
    let aidamLoadedFor = {}; // tabName -> file_id last rendered into that tab

    function openAidamPanel() {
        if (typeof currentLightboxFile === 'undefined' || !currentLightboxFile || !currentLightboxFile.id) return;
        aidamCurrentFileId = currentLightboxFile.id;
        aidamLoadedFor = {};
        aidamStatusCache = null;  // re-read backend/provisioning state per open

        const overlay = document.getElementById('aidam-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.opacity = '1', 10);
        document.body.classList.add('modal-open');

        aidamSwitchTab('similar');
    }

    // Global entry (sidebar AI hub): no file context. Every tab shows its
    // gallery-wide counterpart -- Status, Clusters, the duplicate sweep,
    // the reviews browser, and semantic search.
    function openAidamPanelGlobal(tab, searchQuery) {
        aidamCurrentFileId = null;
        aidamLoadedFor = {};
        aidamStatusCache = null;

        const overlay = document.getElementById('aidam-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.opacity = '1', 10);
        document.body.classList.add('modal-open');

        aidamSwitchTab(tab || 'status');
        if (tab === 'search' && searchQuery) {
            const input = document.getElementById('aidam-search-input');
            if (input) { input.value = searchQuery; aidamRunSemanticSearch(); }
        }
    }

    function closeAidamPanel() {
        aidamStopProvisionPoll();
        aidamStopIndexPoll();
        aidamStopStatusPoll();
        const overlay = document.getElementById('aidam-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
            document.body.classList.remove('modal-open');
        }, 200);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const overlay = document.getElementById('aidam-overlay');
        if (overlay && overlay.style.display === 'flex') closeAidamPanel();
    });

    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('aidam-overlay');
        if (overlay) {
            overlay.addEventListener('click', () => closeAidamPanel());
        }
        // Sidebar AI hub: a compact always-on pulse of the ingest state,
        // refreshed every 30s (the panel's Status tab is the deep view).
        if (document.getElementById('ai-hub-stats')) {
            aidamHubRefresh();
            setInterval(aidamHubRefresh, 30000);
        }
    });

    async function aidamHubRefresh() {
        const box = document.getElementById('ai-hub-stats');
        if (!box) return;
        let status = {};
        try {
            status = await (await fetch('/galleryout/api/aidam/status')).json();
        } catch (e) { box.textContent = 'worker unreachable'; return; }
        if (status.enabled === false) { box.textContent = 'AI layer disabled'; return; }
        const ix = status.indexing || {};
        const pct = (done, total) => total ? Math.round((done || 0) / total * 100) + '%' : '—';
        const line1 = `hash ${pct(ix.hashed, ix.files_total)} · sem ${pct(ix.embeddings_semantic, ix.visual_files_total)} · vis ${pct(ix.embeddings_visual, ix.visual_files_total)} · faces ${pct(ix.faces_scanned, ix.visual_files_total)}`;
        const worker = status.worker || {};
        const prov = (worker.provisioning || {}).state;
        const devices = status.devices || {};
        const gpuDev = Object.values(devices).find(d => d && String(d).startsWith('cuda'));
        const parts = [];
        if (String(prov || '') === 'downloading') parts.push('⏳ setting up');
        else if (String(prov || '').startsWith('failed')) parts.push('<span style="color:#ff6b6b;">setup failed</span>');
        parts.push(worker.running ? (gpuDev ? '⚡ ' + escapeAidamHtml(gpuDev) : '🧮 cpu') : '<span style="color:#ff6b6b;">worker stopped</span>');
        const errs = (worker.stats || {}).errors || 0;
        if (errs > 0) parts.push(`<span style="color:#e8a19a;">${errs} errors</span>`);
        // Cluster-hash backfill (workflow/prompt/model-set identities) runs in
        // its own background thread; show it here while it works.
        let clusterLine = '';
        try {
            const ch = await (await fetch('/galleryout/api/cluster_hash_status')).json();
            if (ch.status === 'success' && (ch.running || ch.pending > 0)) {
                const prog = (ch.running && ch.total > 0) ? `${ch.done}/${ch.total}` : `${ch.pending} queued`;
                clusterLine = `<div><span style="color:#ffc107;">🧬 hashing cluster identities: ${prog}</span></div>`;
            }
        } catch (e) { /* status endpoint unavailable: hide the line */ }
        box.innerHTML = `<div>${line1}</div><div>${parts.join(' · ')}</div>${clusterLine}`;
    }

    let aidamActiveTab = 'similar';  // which tab a finished provisioning run should reload

    function aidamSwitchTab(tab) {
        aidamActiveTab = tab;
        ['similar', 'faces', 'review', 'search', 'status'].forEach(t => {
            const panel = document.getElementById('aidam-tab-' + t);
            const btn = document.getElementById('aidam-tab-btn-' + t);
            if (panel) panel.style.display = (t === tab) ? 'flex' : 'none';
            if (btn) btn.classList.toggle('aidam-tab-active', t === tab);
        });
        if (tab !== 'status') aidamStopStatusPoll();
        aidamEnsureTabLoaded(tab);
    }

    function aidamSetSimilarChrome(perFile) {
        // The space toggle and Duplicates header only make sense per-file;
        // global mode replaces the pane with the duplicate sweep.
        const toggle = document.getElementById('aidam-similar-chrome-toggle');
        const dupTitle = document.getElementById('aidam-similar-chrome-dup-title');
        if (toggle) toggle.style.display = perFile ? 'inline-flex' : 'none';
        if (dupTitle) dupTitle.style.display = perFile ? 'block' : 'none';
    }

    function aidamEnsureTabLoaded(tab) {
        if (tab === 'status') { aidamLoadStatusTab(); return; }
        if (tab === 'search') { aidamRenderSearchTab(); return; }
        if (!aidamCurrentFileId) {
            // Global mode: every tab shows its gallery-wide counterpart.
            aidamSetSimilarChrome(false);
            if (tab === 'faces') { aidamBrowseAllClusters(); return; }
            if (tab === 'similar') { aidamLoadDuplicatesOverview(); return; }
            if (tab === 'review') { aidamLoadReviewsBrowser(); return; }
            return;
        }
        aidamSetSimilarChrome(true);
        if (aidamLoadedFor[tab] === aidamCurrentFileId) return;
        aidamLoadedFor[tab] = aidamCurrentFileId;
        if (tab === 'similar') { aidamLoadSimilar(); aidamLoadDuplicates(); }
        else if (tab === 'faces') { aidamLoadFaces(); }
        else if (tab === 'review') { aidamLoadReview(); }
    }

    // --- shared render helpers ---
    function escapeAidamHtml(str) {
        const div = document.createElement('div');
        div.textContent = (str === null || str === undefined) ? '' : String(str);
        return div.innerHTML;
    }

    function aidamSpinner() { return '<div class="aidam-status-msg">⏳ Loading…</div>'; }
    function aidamDisabledMsg() { return '<div class="aidam-status-msg">🚫 The AI layer is disabled on this server. Ask an administrator to enable it (ENABLE_AI_DAM).</div>'; }
    function aidamEmptyMsg(msg) { return `<div class="aidam-status-msg">🌙 ${escapeAidamHtml(msg || 'No data yet.')}</div>`; }
    function aidamErrorMsg(msg) { return `<div class="aidam-status-msg aidam-status-error">⚠️ ${escapeAidamHtml(msg)}</div>`; }

    // One /status fetch per panel open, shared by every tab's empty state.
    let aidamStatusCache = null;
    async function aidamFetchStatus() {
        if (aidamStatusCache !== null) return aidamStatusCache;
        try {
            const res = await fetch('/galleryout/api/aidam/status');
            aidamStatusCache = await res.json();
        } catch (e) { aidamStatusCache = {}; }
        return aidamStatusCache;
    }

    // Live provisioning progress: while the worker reports 'downloading',
    // poll /status every 2s, render current item + percent, and reload the
    // open tab the moment provisioning finishes so it populates itself.
    let aidamProvisionPoll = null;

    function aidamStopProvisionPoll() {
        if (aidamProvisionPoll !== null) { clearInterval(aidamProvisionPoll); aidamProvisionPoll = null; }
    }

    function aidamProvisionProgressHtml(prov) {
        const doneCount = (prov.done || []).length;
        const current = prov.current
            ? `<div style="margin-top:8px; color:#fff;">${escapeAidamHtml(prov.current)}</div><div style="color:var(--ai-color); font-weight:700;">${escapeAidamHtml(prov.detail || 'starting…')}</div>`
            : '';
        return `<div class="aidam-status-msg" id="aidam-provision-progress">⏳ Setting up the AI layer (${escapeAidamHtml((prov.groups || []).join(', '))}) — ${doneCount} item${doneCount === 1 ? '' : 's'} done.${current}<div style="margin-top:8px; font-size:0.78rem;">This tab activates automatically when it finishes.</div></div>`;
    }

    function aidamStartProvisionPoll() {
        if (aidamProvisionPoll !== null) return;
        aidamProvisionPoll = setInterval(async () => {
            let status = {};
            try { status = await (await fetch('/galleryout/api/aidam/status')).json(); } catch (e) { return; }
            aidamStatusCache = status;
            const prov = (status.worker || {}).provisioning || {};
            const box = document.getElementById('aidam-provision-progress');
            if (prov.state === 'downloading') {
                if (box) box.outerHTML = aidamProvisionProgressHtml(prov);
                return;
            }
            // Finished (done/failed/idle): stop polling and reload whatever
            // tab is showing the progress card so real content appears.
            aidamStopProvisionPoll();
            if (box) { aidamLoadedFor = {}; aidamEnsureTabLoaded(aidamActiveTab); }
        }, 2000);
    }

    // --- on-demand indexing: a pending file is indexed NOW, not whenever ---
    // the background crawl reaches it. One POST per file per page load;
    // while any visible section is pending, the active tab reloads on a
    // short poll until real results (or a definitive empty) arrive.
    let aidamIndexPoll = null;
    let aidamIndexRequested = {};   // fileId -> true once /index was POSTed
    let aidamPendingNow = {};       // section -> still waiting on the worker

    function aidamStopIndexPoll() {
        if (aidamIndexPoll !== null) { clearInterval(aidamIndexPoll); aidamIndexPoll = null; }
        aidamPendingNow = {};
    }

    function aidamMarkPending(section, isPending) {
        aidamPendingNow[section] = isPending;
        if (!Object.values(aidamPendingNow).some(Boolean)) {
            if (aidamIndexPoll !== null) { clearInterval(aidamIndexPoll); aidamIndexPoll = null; }
        }
    }

    async function aidamRequestIndex() {
        if (aidamIndexRequested[aidamCurrentFileId]) return;
        aidamIndexRequested[aidamCurrentFileId] = true;
        const fileId = aidamCurrentFileId;
        try {
            await fetch(`/galleryout/api/aidam/index/${encodeURIComponent(fileId)}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
            });
        } catch (e) {
            // Network failure: allow the next poll tick to retry. (A denied
            // request in restricted mode returns a response, keeps the flag,
            // and is not retried -- the background crawl still gets there.)
            delete aidamIndexRequested[fileId];
        }
    }

    function aidamIndexingProgressLine(status) {
        const ix = (status || {}).indexing || {};
        if (!ix.files_total) return '';
        const parts = [`${ix.hashed}/${ix.files_total} hashed`];
        if (ix.visual_files_total) {
            parts.push(`${ix.embeddings_semantic}/${ix.visual_files_total} semantic`);
            parts.push(`${ix.embeddings_visual}/${ix.visual_files_total} visual`);
            parts.push(`${ix.faces_scanned}/${ix.visual_files_total} faces`);
        }
        const devices = (status || {}).devices || {};
        const devParts = Object.entries(devices)
            .filter(([, dev]) => dev)
            .map(([key, dev]) => `${escapeAidamHtml(key)} on ${escapeAidamHtml(dev)}`);
        const devLine = devParts.length
            ? `<div style="margin-top:4px; font-size:0.78rem; color:var(--text-muted);">Compute: ${devParts.join(' · ')}</div>`
            : '';
        return `<div style="margin-top:8px; font-size:0.78rem; color:var(--text-muted);">Gallery indexing: ${parts.join(' · ')}</div>${devLine}`;
    }

    async function aidamPendingMsg(section, what) {
        aidamMarkPending(section, true);
        aidamRequestIndex();
        aidamStartIndexPoll();
        const status = await aidamFetchStatus();
        return `<div class="aidam-status-msg">⚡ ${escapeAidamHtml(what)} — indexing this file now; results appear here automatically.${aidamIndexingProgressLine(status)}</div>`;
    }

    let aidamIndexPollTicks = 0;
    const AIDAM_INDEX_POLL_MAX_TICKS = 150;  // 150 x 4s = 10 min (reviews take minutes on CPU)

    function aidamStartIndexPoll() {
        if (aidamIndexPoll !== null) return;
        aidamIndexPollTicks = 0;
        aidamIndexPoll = setInterval(() => {
            // A permanently failing file (unreadable, worker error) would
            // otherwise keep this "in progress" spinner honest-looking
            // forever; after the cap, stop and say so.
            if (++aidamIndexPollTicks > AIDAM_INDEX_POLL_MAX_TICKS) {
                aidamStopIndexPoll();
                const panel = document.getElementById('aidam-tab-' + aidamActiveTab);
                const msg = panel && panel.querySelector('.aidam-status-msg');
                if (msg) msg.innerHTML = '⚠️ Still no results after several minutes — the worker may have hit an error on this file. Check the server log, then reopen this panel to retry.';
                return;
            }
            aidamStatusCache = null;   // refresh the backlog numbers too
            aidamLoadedFor = {};       // force a real re-fetch of the open tab
            aidamEnsureTabLoaded(aidamActiveTab);
        }, 4000);
    }

    // --- STATUS TAB: live ingest/backlog dashboard --------------------------
    // Polls /status every 2s while visible; rates and ETA come from the
    // deltas between successive samples, so they reflect what the worker
    // is ACTUALLY doing right now, not an average since startup.
    let aidamStatusPoll = null;
    let aidamStatusPrevSample = null;   // {t, indexing} from the previous tick
    let aidamStatusRates = {};          // stage -> smoothed files/sec

    function aidamStopStatusPoll() {
        if (aidamStatusPoll !== null) { clearInterval(aidamStatusPoll); aidamStatusPoll = null; }
        aidamStatusPrevSample = null;
        aidamStatusRates = {};
    }

    function aidamLoadStatusTab() {
        aidamRenderStatusTick();
        if (aidamStatusPoll === null) {
            aidamStatusPoll = setInterval(aidamRenderStatusTick, 2000);
        }
    }

    function aidamRateFor(stage, done, now) {
        // Exponential smoothing over per-tick deltas keeps the number
        // readable while still reacting within a few seconds.
        if (aidamStatusPrevSample) {
            const dt = (now - aidamStatusPrevSample.t) / 1000;
            const prev = aidamStatusPrevSample.indexing[stage];
            if (dt > 0 && prev !== undefined && done >= prev) {
                const instant = (done - prev) / dt;
                const old = aidamStatusRates[stage] || 0;
                aidamStatusRates[stage] = old * 0.6 + instant * 0.4;
            }
        }
        return aidamStatusRates[stage] || 0;
    }

    function aidamEta(remaining, perSec) {
        if (remaining <= 0) return 'done';
        if (!perSec || perSec <= 0) return '&mdash;';
        const s = Math.round(remaining / perSec);
        if (s < 90) return `~${s}s`;
        if (s < 5400) return `~${Math.round(s / 60)}m`;
        return `~${(s / 3600).toFixed(1)}h`;
    }

    function aidamStageBar(label, done, total, rateKey, now) {
        const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0;
        const rate = aidamRateFor(rateKey, done, now);
        const rateTxt = rate > 0.05 ? ` &middot; ${(rate * 60).toFixed(0)}/min` : '';
        const eta = total > 0 ? ` &middot; ETA ${aidamEta(total - done, rate)}` : '';
        return `
            <div class="aidam-meter">
                <div class="aidam-meter-label"><span>${label}</span><span>${done.toLocaleString()} / ${total.toLocaleString()} (${pct}%)${rateTxt}${eta}</span></div>
                <div class="aidam-meter-track"><div class="aidam-meter-fill" style="width:${pct}%;"></div></div>
            </div>`;
    }

    async function aidamRenderStatusTick() {
        const box = document.getElementById('aidam-status-content');
        if (!box) return;
        let status = {};
        try {
            status = await (await fetch('/galleryout/api/aidam/status')).json();
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Cannot reach the server.');
            return;
        }
        if (status.enabled === false) { aidamStopStatusPoll(); box.innerHTML = aidamDisabledMsg(); return; }
        const now = Date.now();
        const ix = status.indexing || {};
        const worker = status.worker || {};
        const stats = worker.stats || {};
        const prov = worker.provisioning || {};
        const devices = status.devices || {};
        const backends = status.backends || {};

        let html = '';

        if (prov.state === 'downloading') {
            html += aidamProvisionProgressHtml(prov);
        } else if (String(prov.state || '').startsWith('failed')) {
            html += `<div class="aidam-status-msg aidam-status-error">⚠️ Auto-setup failed: ${escapeAidamHtml(String(prov.state).slice(8, 300))}</div>`;
        }

        html += '<span class="aidam-section-title">Ingest backlog</span><div class="aidam-meter-row">';
        html += aidamStageBar('Hashes / duplicates', ix.hashed || 0, ix.files_total || 0, 'hashed', now);
        html += aidamStageBar('Semantic embeddings', ix.embeddings_semantic || 0, ix.visual_files_total || 0, 'embeddings_semantic', now);
        html += aidamStageBar('Visual embeddings', ix.embeddings_visual || 0, ix.visual_files_total || 0, 'embeddings_visual', now);
        html += aidamStageBar('Face scans', ix.faces_scanned || 0, ix.visual_files_total || 0, 'faces_scanned', now);
        html += aidamStageBar('Reviews', ix.reviews_scanned || 0, ix.visual_files_total || 0, 'reviews_scanned', now);
        html += '</div>';

        const gpu = status.gpu;
        if (gpu) {
            html += '<span class="aidam-section-title">GPU</span><div style="color:#ddd; font-size:0.85rem; line-height:1.7;">';
            (gpu.gpus || []).forEach((card, idx) => {
                const active = devices && Object.values(devices).some(d => d === ('cuda:' + idx))
                    || ((gpu.gpus || []).length === 1 && Object.values(devices || {}).some(d => d === 'cuda'));
                // Live VRAM occupancy; flag pressure so an OOM-in-waiting
                // (ComfyUI holding the card) is visible at a glance.
                let vramTxt = escapeAidamHtml(card.vram || '?');
                if (card.vram_used) {
                    const usedMiB = parseFloat(card.vram_used);
                    const totalMiB = parseFloat(card.vram);
                    const hot = totalMiB > 0 && usedMiB / totalMiB > 0.85;
                    vramTxt = `${escapeAidamHtml(card.vram_used)} used / ${escapeAidamHtml(card.vram)}`
                        + (hot ? ' <b style="color:#ff6b6b;">⚠ VRAM pressure</b>' : '');
                }
                html += `🎮 GPU${idx}: ${escapeAidamHtml(card.name || '?')} &middot; compute ${escapeAidamHtml(card.compute_capability || '?')} &middot; ${vramTxt}${active ? ' &middot; <b style="color:var(--ai-color);">in use</b>' : ''}<br>`;
            });
            html += `driver ${escapeAidamHtml(gpu.driver || '?')} (CUDA ${escapeAidamHtml(gpu.driver_cuda || '?')}) &middot; wheels ${escapeAidamHtml(String(gpu.torch_index || '').split('/').pop() || '?')}</div>`;
        }

        html += '<span class="aidam-section-title">Backends</span><div style="display:flex; flex-wrap:wrap; gap:8px;">';
        Object.keys(backends).sort().forEach(key => {
            const up = backends[key];
            const dev = devices[key];
            const chip = up
                ? `✅ ${escapeAidamHtml(key)}${dev ? ' on ' + escapeAidamHtml(dev) : ''}`
                : `⭕ ${escapeAidamHtml(key)}`;
            html += `<span style="background:#151515; border:1px solid #333; border-radius:8px; padding:5px 10px; font-size:0.8rem; color:${up ? '#ddd' : 'var(--text-muted)'};">${chip}</span>`;
        });
        html += '</div>';

        html += `<span class="aidam-section-title">Worker</span>
            <div style="color:#ddd; font-size:0.85rem; line-height:1.7;">
                ${worker.running ? '🟢 running' : '🔴 not running'}
                &middot; cycles ${stats.cycles || 0}
                &middot; priority queue ${worker.priority_queued || 0}
                &middot; errors ${stats.errors || 0}
                ${status.app_git_ref ? '&middot; build ' + escapeAidamHtml(status.app_git_ref) : ''}
            </div>`;

        const errs = worker.recent_errors || [];
        if (errs.length) {
            html += '<span class="aidam-section-title">Recent errors</span><div style="display:flex; flex-direction:column; gap:6px;">';
            errs.slice(-8).reverse().forEach(err => {
                const when = err.at ? new Date(err.at * 1000).toLocaleTimeString() : '';
                html += `<div style="background:rgba(231,76,60,0.08); border:1px solid #5c2b24; border-radius:8px; padding:6px 10px; font-size:0.78rem; color:#e8a19a;">${escapeAidamHtml(when)} &middot; ${escapeAidamHtml(err.message || '')}</div>`;
            });
            html += '</div>';
        }

        box.innerHTML = html;
        aidamStatusPrevSample = { t: now, indexing: { ...ix } };
    }

    // Empty state that says WHY: backend missing -> live download progress,
    // the provision command, or the plain "no data yet" when the backend is
    // fine.
    async function aidamBackendAwareEmpty(backendKey, groupName, fallbackMsg) {
        const status = await aidamFetchStatus();
        const backends = status.backends || {};
        if (backends[backendKey] === false) {
            const prov = (status.worker || {}).provisioning || {};
            if (prov.state === 'downloading') {
                aidamStartProvisionPoll();
                return aidamProvisionProgressHtml(prov);
            }
            if (String(prov.state || '').startsWith('failed')) {
                return `<div class="aidam-status-msg">⚠️ Automatic setup failed: ${escapeAidamHtml(String(prov.state).slice(8, 200))}. Run <code>python -m smartgallery_ai provision ${groupName}</code> on the server, then reopen this panel.</div>`;
            }
            return `<div class="aidam-status-msg">📦 The ${escapeAidamHtml(groupName)} model is not available yet. Restart the app and it installs itself automatically (packages and weights; AI_DAM_AUTO_PROVISION=true is the default), or run <code>python -m smartgallery_ai provision ${groupName}</code> on the server.</div>`;
        }
        return aidamEmptyMsg(fallbackMsg);
    }
    function aidamBackButton(fnName) { return `<button type="button" class="glass-btn" style="padding:4px 10px; font-size:0.8rem; margin-bottom:12px;" onclick="${fnName}()">← Back</button>`; }

    function aidamThumbCard(fileId, scoreLabel, badgeHtml) {
        const score = scoreLabel ? `<div class="aidam-thumb-score">${escapeAidamHtml(scoreLabel)}</div>` : '';
        const badge = badgeHtml || '';
        const safeId = escapeAidamHtml(fileId);
        return `
            <div class="aidam-thumb-card" data-file-id="${safeId}" onclick="aidamOpenFile(this.dataset.fileId)" title="${safeId}">
                <img src="/galleryout/thumbnail/${encodeURIComponent(fileId)}" loading="lazy" alt="">
                ${badge}${score}
            </div>`;
    }

    function aidamOpenFile(fileId) {
        if (typeof galleryItems !== 'undefined' && Array.isArray(galleryItems)) {
            const item = galleryItems.find(i => i.dataset.fileId === fileId);
            if (item && typeof openLightbox === 'function') {
                closeAidamPanel();
                openLightbox(null, fileId, true);
                return;
            }
        }
        window.open(`/galleryout/file/${encodeURIComponent(fileId)}`, '_blank');
    }

    function aidamFormatScore(score) {
        return (score === null || score === undefined) ? '' : 'score ' + Number(score).toFixed(2);
    }

    // --- SIMILAR ---
    function aidamSetSimilarSpace(space) {
        aidamSimilarSpace = space;
        document.getElementById('aidam-space-semantic-btn').classList.toggle('aidam-toggle-active', space === 'semantic');
        document.getElementById('aidam-space-visual-btn').classList.toggle('aidam-toggle-active', space === 'visual');
        aidamLoadSimilar();
    }

    async function aidamLoadSimilar() {
        const box = document.getElementById('aidam-similar-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/similar/${encodeURIComponent(aidamCurrentFileId)}?space=${aidamSimilarSpace}`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            const neighbors = data.neighbors || [];
            if (neighbors.length === 0) {
                const status = await aidamFetchStatus();
                if (data.pending && (status.backends || {})[aidamSimilarSpace] !== false) {
                    box.innerHTML = await aidamPendingMsg(
                        'similar', `No ${aidamSimilarSpace} embedding for this file yet`);
                    return;
                }
                aidamMarkPending('similar', false);
                box.innerHTML = await aidamBackendAwareEmpty(
                    aidamSimilarSpace, aidamSimilarSpace,
                    data.pending ? 'Waiting for the backend…'
                                 : (data.note || 'No similar files found.'));
                return;
            }
            aidamMarkPending('similar', false);
            box.innerHTML = `<div class="aidam-thumb-grid">${neighbors.map(n => aidamThumbCard(n.file_id, aidamFormatScore(n.score))).join('')}</div>`;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load similar files.');
        }
    }

    async function aidamLoadDuplicates() {
        const box = document.getElementById('aidam-duplicates-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/duplicates/${encodeURIComponent(aidamCurrentFileId)}`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            const exact = data.exact || [];
            const near = data.near || [];
            if (exact.length === 0 && near.length === 0) {
                if (data.pending) {
                    box.innerHTML = await aidamPendingMsg('duplicates', 'This file is not hashed yet');
                    return;
                }
                aidamMarkPending('duplicates', false);
                box.innerHTML = aidamEmptyMsg('No duplicates found.');
                return;
            }
            aidamMarkPending('duplicates', false);
            let html = '<div class="aidam-thumb-grid">';
            exact.forEach(fid => { html += aidamThumbCard(fid, null, '<span class="aidam-badge-exact">exact</span>'); });
            near.forEach(n => { html += aidamThumbCard(n.file_id, null, `<span class="aidam-badge-near">near &middot; d=${escapeAidamHtml(n.distance)}</span>`); });
            html += '</div>';
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load duplicates.');
        }
    }

    // --- FACES ---
    const _AIDAM_FACE_PALETTE = ['#34db98', '#3498db', '#e67e22', '#e74c3c', '#9b59b6', '#f1c40f'];
    function aidamFaceColor(idx) { return _AIDAM_FACE_PALETTE[idx % _AIDAM_FACE_PALETTE.length]; }

    function aidamBboxDiv(bbox, idx) {
        if (!bbox || bbox.length < 4) return '';
        const [x, y, w, h] = bbox;
        return `<div class="aidam-bbox" style="left:${(x * 100).toFixed(2)}%; top:${(y * 100).toFixed(2)}%; width:${(w * 100).toFixed(2)}%; height:${(h * 100).toFixed(2)}%; border-color:${aidamFaceColor(idx)};"></div>`;
    }

    async function aidamLoadFaces() {
        const box = document.getElementById('aidam-faces-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/faces/${encodeURIComponent(aidamCurrentFileId)}`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            const faces = data.faces || [];
            if (faces.length === 0) {
                const status = await aidamFetchStatus();
                if (data.pending && (status.backends || {}).face !== false) {
                    box.innerHTML = await aidamPendingMsg('faces', 'This file has not been scanned for faces yet');
                    return;
                }
                aidamMarkPending('faces', false);
                box.innerHTML = await aidamBackendAwareEmpty(
                    'face', 'faces',
                    data.pending ? 'Waiting for the backend…'
                                 : 'Scanned — no faces detected in this file.');
                return;
            }
            aidamMarkPending('faces', false);

            let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="color:var(--text-muted); font-size:0.85rem;">${faces.length} face${faces.length === 1 ? '' : 's'} detected</span>
                <button type="button" class="glass-btn" style="padding:4px 10px; font-size:0.8rem;" onclick="aidamBrowseAllClusters()">🗂️ Browse all clusters</button>
            </div>`;

            html += `<div class="aidam-preview-wrap" id="aidam-faces-preview">
                <img src="/galleryout/thumbnail/${encodeURIComponent(aidamCurrentFileId)}" alt="">
                ${faces.map((f, idx) => aidamBboxDiv(f.bbox, idx)).join('')}
            </div>`;

            html += '<div class="aidam-face-list">';
            faces.forEach((f, idx) => {
                const det = (f.det_score === null || f.det_score === undefined) ? 'n/a' : Math.round(f.det_score * 100) + '%';
                const clusterBtn = (f.cluster_id === null || f.cluster_id === undefined)
                    ? `<span style="margin-left:auto; color:var(--text-muted); font-size:0.75rem;">unclustered</span>`
                    : `<button type="button" class="glass-btn" style="padding:2px 8px; font-size:0.75rem; margin-left:auto;" onclick="aidamViewCluster(${f.cluster_id})">View cluster</button>`;
                html += `
                    <div class="aidam-face-row">
                        <span class="aidam-face-swatch" style="background:${aidamFaceColor(idx)};"></span>
                        <span>Face #${escapeAidamHtml(f.face_id)} &middot; det ${det}</span>
                        ${clusterBtn}
                    </div>`;
            });
            html += '</div>';

            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load faces.');
        }
    }

    async function aidamViewCluster(clusterId) {
        const box = document.getElementById('aidam-faces-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/faces/clusters/${encodeURIComponent(clusterId)}`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            if (!data.cluster) {
                box.innerHTML = aidamBackButton('aidamLoadFaces') + aidamEmptyMsg('Cluster not found.');
                return;
            }
            const members = data.members || [];
            let html = aidamBackButton(aidamCurrentFileId ? 'aidamLoadFaces' : 'aidamBrowseAllClusters');
            html += `<h5 style="margin:0 0 10px 0; color:#fff;">🙂 ${escapeAidamHtml(data.cluster.label || ('Cluster #' + data.cluster.cluster_id))}
                <span style="color:var(--text-muted); font-weight:normal; font-size:0.8rem;">(${data.cluster.size} face${data.cluster.size === 1 ? '' : 's'})</span>
                <button type="button" class="glass-btn" style="padding:2px 8px; font-size:0.75rem; margin-left:6px;"
                        onclick="aidamRenameCluster(${data.cluster.cluster_id}, this)" title="Name this person/character">✏️ Rename</button></h5>`;
            if (members.length === 0) {
                html += aidamEmptyMsg('No members in this cluster.');
            } else {
                html += `<div class="aidam-thumb-grid">${members.map(m => aidamThumbCard(m.file_id, (m.det_score === null || m.det_score === undefined) ? '' : 'det ' + Math.round(m.det_score * 100) + '%')).join('')}</div>`;
            }
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load cluster.');
        }
    }

    async function aidamRenameCluster(clusterId, btnEl) {
        const label = prompt('Name this cluster (person / character); empty clears the name:');
        if (label === null) return;
        try {
            const res = await fetch(`/galleryout/api/aidam/faces/clusters/${encodeURIComponent(clusterId)}/label`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label: label }),
            });
            if (res.ok) aidamViewCluster(clusterId);
        } catch (e) { /* rename is best-effort; the view simply keeps the old name */ }
    }

    async function aidamBrowseAllClusters() {
        const box = document.getElementById('aidam-faces-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch('/galleryout/api/aidam/faces/clusters');
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            const clusters = data.clusters || [];
            // Back leads to the per-file faces view; in global mode there
            // is no file to go back to.
            let html = aidamCurrentFileId ? aidamBackButton('aidamLoadFaces') : '';
            if (clusters.length === 0) {
                html += aidamEmptyMsg('No face clusters yet.');
                box.innerHTML = html;
                return;
            }
            html += '<div class="aidam-cluster-grid">';
            clusters.forEach(c => {
                const sample = (c.sample_file_ids && c.sample_file_ids.length > 0) ? c.sample_file_ids[0] : null;
                html += `
                    <div class="aidam-cluster-card" onclick="aidamViewCluster(${c.cluster_id})">
                        ${sample ? `<img src="/galleryout/thumbnail/${encodeURIComponent(sample)}" loading="lazy" alt="">` : '<div class="aidam-cluster-noimg">🙂</div>'}
                        <div class="aidam-cluster-label">${escapeAidamHtml(c.label || ('Cluster #' + c.cluster_id))}</div>
                        <div class="aidam-cluster-size">${c.size} face${c.size === 1 ? '' : 's'}</div>
                    </div>`;
            });
            html += '</div>';
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load clusters.');
        }
    }

    // --- REVIEW ---
    const _AIDAM_SEVERITY_COLORS = { low: '#3498db', medium: '#f1c40f', high: '#e67e22', critical: '#e74c3c' };

    function aidamMeter(label, value) {
        const hasValue = value !== null && value !== undefined;
        const pct = hasValue ? Math.max(0, Math.min(100, Math.round(value * 100))) : 0;
        const shown = hasValue ? pct + '%' : 'n/a';
        return `
            <div class="aidam-meter">
                <div class="aidam-meter-label"><span>${escapeAidamHtml(label)}</span><span>${shown}</span></div>
                <div class="aidam-meter-track"><div class="aidam-meter-fill" style="width:${pct}%;"></div></div>
            </div>`;
    }

    function aidamToggleMask(maskUrl, btnEl) {
        const overlay = document.getElementById('aidam-mask-overlay');
        if (!overlay) return;
        const isShowingThis = overlay.style.display !== 'none' && overlay.dataset.maskUrl === maskUrl;
        document.querySelectorAll('.aidam-mask-toggle-btn').forEach(b => { b.textContent = '🎭 Show mask'; });
        if (isShowingThis) {
            overlay.style.display = 'none';
            overlay.removeAttribute('src');
            overlay.dataset.maskUrl = '';
        } else {
            overlay.src = maskUrl;
            overlay.style.display = 'block';
            overlay.dataset.maskUrl = maskUrl;
            if (btnEl) btnEl.textContent = '🎭 Hide mask';
        }
    }

    // --- SEMANTIC SEARCH (gallery-wide) ---
    let aidamSearchLastHtml = null;  // survives tab switches within a panel session

    function aidamRenderSearchTab() {
        const box = document.getElementById('aidam-search-content');
        if (!box) return;
        box.innerHTML = aidamSearchLastHtml !== null
            ? aidamSearchLastHtml
            : aidamEmptyMsg('Search your gallery by MEANING: the query text and every image live in the same CLIP embedding space. Try "close-up portrait, dramatic lighting".');
    }

    async function aidamRunSemanticSearch() {
        const input = document.getElementById('aidam-search-input');
        const box = document.getElementById('aidam-search-content');
        const query = (input && input.value || '').trim();
        if (!query || !box) return;
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/search/semantic?q=${encodeURIComponent(query)}&k=48`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            if (data.note) {
                box.innerHTML = await aidamBackendAwareEmpty('semantic', 'semantic', data.note);
            } else if (!data.results || data.results.length === 0) {
                box.innerHTML = aidamEmptyMsg(`Nothing close to "${escapeAidamHtml(query)}" yet — results grow as embedding indexing progresses (see 📊 Status).`);
            } else {
                box.innerHTML = `<div class="aidam-thumb-grid">${data.results.map(r => aidamThumbCard(r.file_id, aidamFormatScore(r.score))).join('')}</div>`;

        } catch (e) {
            box.innerHTML = aidamErrorMsg('Search failed.');
        }
    }

    // --- GLOBAL DUPLICATE SWEEP (Similar tab without a file) ---
    function aidamFormatBytes(n) {
        if (!n || n <= 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), units.length - 1);
        return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    async function aidamLoadDuplicatesOverview() {
        const box = document.getElementById('aidam-similar-content');
        const dup = document.getElementById('aidam-duplicates-content');
        if (dup) dup.innerHTML = '';
        if (!box) return;
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch('/galleryout/api/aidam/duplicates');
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            const groups = data.groups || [];
            if (groups.length === 0) {
                box.innerHTML = aidamEmptyMsg('No exact duplicates in the gallery (among hashed files — see 📊 Status for hashing progress).');
                return;
            }
            let html = `<div style="color:#ddd; font-size:0.9rem; margin-bottom:12px;">
                ♻️ <b>${data.group_count}</b> duplicate group${data.group_count === 1 ? '' : 's'} ·
                <b>${data.redundant_files}</b> redundant file${data.redundant_files === 1 ? '' : 's'} ·
                <b>${aidamFormatBytes(data.total_bytes_reclaimable)}</b> reclaimable (keep one copy of each)
            </div>`;
            groups.forEach(g => {
                html += `<span class="aidam-section-title">${g.count} copies · ${aidamFormatBytes(g.bytes_reclaimable)} reclaimable</span>`;
                html += `<div class="aidam-thumb-grid">${g.file_ids.map(fid => aidamThumbCard(fid, null)).join('')}</div>`;
            });
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load the duplicate sweep.');
        }
    }

    // --- GLOBAL REVIEWS BROWSER (Review tab without a file) ---
    let aidamReviewsSort = 'quality_asc';

    async function aidamLoadReviewsBrowser() {
        const box = document.getElementById('aidam-review-content');
        if (!box) return;
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/reviews?sort=${encodeURIComponent(aidamReviewsSort)}&limit=60`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            let html = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                <span style="color:var(--text-muted); font-size:0.85rem;">${data.total || 0} reviewed file${(data.total || 0) === 1 ? '' : 's'}</span>
                <select onchange="aidamReviewsSort = this.value; aidamLoadReviewsBrowser();"
                        style="background:#111; color:#fff; border:1px solid #444; border-radius:8px; padding:4px 8px; font-size:0.8rem;">
                    <option value="quality_asc" ${aidamReviewsSort === 'quality_asc' ? 'selected' : ''}>Worst quality first</option>
                    <option value="quality_desc" ${aidamReviewsSort === 'quality_desc' ? 'selected' : ''}>Best quality first</option>
                    <option value="alignment_asc" ${aidamReviewsSort === 'alignment_asc' ? 'selected' : ''}>Least prompt-aligned first</option>
                    <option value="newest" ${aidamReviewsSort === 'newest' ? 'selected' : ''}>Newest reviews first</option>
                </select>
            </div>`;
            const reviews = data.reviews || [];
            if (reviews.length === 0) {
                html += aidamEmptyMsg('No reviews yet — the critic works through the queue when the fast stages are idle, and any image you open gets reviewed with priority.');
            } else {
                html += `<div class="aidam-thumb-grid">${reviews.map(r => {
                    const q = (r.quality === null || r.quality === undefined) ? 'n/a' : Math.round(r.quality * 10) + '/10';
                    const badge = `<span class="aidam-badge-near" title="${escapeAidamHtml(r.summary || '')}">${r.finding_count > 0 ? '⚠ ' + r.finding_count + ' · ' : ''}${q}</span>`;
                    return aidamThumbCard(r.file_id, null, badge);
                }).join('')}</div>`;
            }
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load the reviews browser.');
        }
    }

    // --- FEEDBACK (thumbs on findings; exported for model tuning) ---
    async function aidamSendFeedback(targetKind, targetId, verdict, btnEl) {
        try {
            const res = await fetch('/galleryout/api/aidam/review/feedback', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_kind: targetKind, target_id: targetId,
                                       verdict: verdict, file_id: aidamCurrentFileId }),
            });
            if (res.ok && btnEl) {
                const wrap = btnEl.parentElement;
                if (wrap) wrap.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.opacity = '0.35'; });
                btnEl.style.opacity = '1';
            }
        } catch (e) { /* feedback is best-effort */ }
    }

    function aidamFindingRow(f) {
        const sevColor = _AIDAM_SEVERITY_COLORS[(f.severity || '').toLowerCase()] || '#888';
        const confShown = (f.confidence === null || f.confidence === undefined) ? 'n/a' : Math.round(f.confidence * 100) + '%';
        const scopeChip = f.localizable
            ? (f.mask_url ? `<button type="button" class="aidam-mask-toggle-btn" onclick="aidamToggleMask('${f.mask_url}', this)">🎭 Show mask</button>` : '')
            : `<span class="aidam-chip-global">global</span>`;
        const feedback = f.finding_id ? `
            <span style="display:inline-flex; gap:2px; flex-shrink:0;">
                <button type="button" title="Finding is correct" style="background:none; border:none; cursor:pointer; font-size:0.85rem;"
                        onclick="aidamSendFeedback('finding', ${f.finding_id}, 'accept', this)">👍</button>
                <button type="button" title="Finding is wrong (false positive)" style="background:none; border:none; cursor:pointer; font-size:0.85rem;"
                        onclick="aidamSendFeedback('finding', ${f.finding_id}, 'false_positive', this)">👎</button>
            </span>` : '';
        return `
            <div class="aidam-finding-row">
                <span class="aidam-chip" style="background:${sevColor}22; color:${sevColor}; border-color:${sevColor};">${escapeAidamHtml(f.severity || 'n/a')}</span>
                <div class="aidam-finding-body">
                    <div class="aidam-finding-type">${escapeAidamHtml(f.type || 'finding')} <span style="color:var(--text-muted); font-weight:normal; font-size:0.75rem;">conf ${confShown}</span></div>
                    ${f.description ? `<div class="aidam-finding-desc">${escapeAidamHtml(f.description)}</div>` : ''}
                </div>
                ${feedback}
                ${scopeChip}
            </div>`;
    }

    async function aidamLoadReview() {
        const box = document.getElementById('aidam-review-content');
        box.innerHTML = aidamSpinner();
        try {
            const res = await fetch(`/galleryout/api/aidam/review/${encodeURIComponent(aidamCurrentFileId)}`);
            const data = await res.json();
            if (data.enabled === false) { box.innerHTML = aidamDisabledMsg(); return; }
            if (!data.review) {
                const status = await aidamFetchStatus();
                if (data.scan_failed) {
                    aidamMarkPending('review', false);
                    box.innerHTML = aidamEmptyMsg('Review was attempted for this file and failed — check the server log. It retries when the file or model changes.');
                    return;
                }
                if (data.pending && (status.backends || {}).critic !== false) {
                    box.innerHTML = await aidamPendingMsg('review',
                        'No review yet — the critic is working through the queue (a review takes minutes per image on CPU)');
                    return;
                }
                aidamMarkPending('review', false);
                box.innerHTML = await aidamBackendAwareEmpty(
                    'critic', 'critic', 'No review computed for this file yet.');
                return;
            }
            aidamMarkPending('review', false);

            const review = data.review;
            const findings = data.findings || [];

            let html = `<div class="aidam-preview-wrap" id="aidam-review-preview">
                <img src="/galleryout/thumbnail/${encodeURIComponent(aidamCurrentFileId)}" alt="">
                <img id="aidam-mask-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; mix-blend-mode:screen; opacity:0.6; pointer-events:none;" alt="">
            </div>`;

            html += `<div class="aidam-meter-row">
                ${aidamMeter('Quality', review.scores ? review.scores.quality : null)}
                ${aidamMeter('Prompt Alignment', review.scores ? review.scores.prompt_alignment : null)}
            </div>`;

            const alignmentMissing = !review.scores || review.scores.prompt_alignment === null
                || review.scores.prompt_alignment === undefined;
            if (alignmentMissing && data.prompt_available === false) {
                html += `<p style="color:var(--text-muted); font-size:0.78rem; margin:-6px 0 12px 0;">No generation prompt is embedded in this file's workflow, so there is nothing to score alignment against.</p>`;
            }

            if (review.summary) {
                html += `<p style="color:#ccc; font-size:0.85rem; font-style:italic; margin:-6px 0 16px 0;">${escapeAidamHtml(review.summary)}</p>`;
            }

            if (findings.length === 0) {
                html += aidamEmptyMsg('No findings.');
            } else {
                html += '<div class="aidam-findings-list">' + findings.map(aidamFindingRow).join('') + '</div>';
            }

            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = aidamErrorMsg('Failed to load review.');
        }
    }
</script>
