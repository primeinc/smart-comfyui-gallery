# Changelog

### **[Unreleased]**

### 🛡️ Data Safety

* **The management screens can no longer be downloaded without signing in.** The gallery serves its own page files at a second address as well, and that address was never given a rule about who may ask for it — so on a server started with `--force-login`, or in Exhibition, anyone who knew the path could fetch the whole management interface, the user manager included, without ever logging in. No pictures, prompts, names or ratings came out that way: the files are the empty screens, not their contents, and every address that fills them in was already checked separately. What it did give away was the full shape of the management side to someone who is not supposed to see it exists. It is now refused unless you are signed in. Nothing changes for a gallery running locally without a login.
* **Docker: the admin password is no longer written to the container log.** On every start the container copies its settings between two internal accounts and announces each one as it goes. It hid values whose name looked like a secret — anything containing TOKEN, API or KEY — but the admin password is not passed under a name like that: the documented way to set it puts it inside `CLI_ARGS`, so it was printed in full, in a log that `docker logs` and any log collector can read. **If you run SmartGallery in Docker with a password, assume it is in your container logs and change it.** The password is now masked whether it arrives inside `CLI_ARGS` or in its own variable, exactly as the gallery already masked it in its own startup banner.
* **Docker: a password with spaces in it now works.** `CLI_ARGS` is split on spaces before it reaches the gallery, so a passphrase like `correct horse battery` arrived as `correct` — no error, and no way to log in with what you had set. Set the password with `ADMIN_PASSWORD` instead, as the README and the supplied compose file now do; nothing splits it.
* **The Exhibition launcher no longer ships with a password in it.** `sample_run_exhibition.bat` — the file whose own instructions tell you to rename it and run it — set the admin password to a word written into the file, and therefore the same word for everyone who downloaded SmartGallery. Exhibition is the mode you hand to family, friends and clients. **If you started Exhibition from that sample without changing the last line, treat that password as public and set your own now.** The sample now has an `ADMIN_PASSWORD` line near the top for you to fill in, and Exhibition refuses to start until you do, rather than falling back to anything. It also told you to rename it to `run_smartgallery.bat`, which would have replaced your main launcher; it now names `run_exhibition.bat`.

* **Account expiry dates now actually expire the account.** Setting an expiry on a visitor's account did nothing: the user manager showed it in red with an hourglass once the date passed, and the account went on signing in indefinitely. If you have ever given someone temporary access this way, they still have it — check your user list. Expired accounts are now refused with a message saying when they lapsed. Signing in as the administrator with the password from your launcher still works regardless, so you cannot lock yourself out.

* **The AI status report now requires sign-in.** It reports on the whole library, and the recent-error list quotes the location on disk of any file that failed processing — so on a gallery protected by a login, someone who never signed in could read folder paths out of it. It still reports while the AI features are switched off, which is how the panel knows to say so.
* **Comments and ratings can no longer be changed without signing in.** On a gallery protected by a login, deleting a comment, rewriting one, or setting and clearing ratings in bulk could all be done by someone who never signed in: those three checked whether the identity in the request matched the one on the record, but never checked that there was a caller at all. Comments are numbered in order, so they could simply be counted through. Posting a comment and rating a single picture were never affected.
* **Two more management addresses now require sign-in.** One of them re-scanned a folder on request — writing to the library and naming each file as it went — for anyone who asked, without signing in. The other listed every album, private ones included, together with the full names of the people each was shared with. Both belong to the management screen; the visitor view never used either.
* **Six addresses that answered anybody now require sign-in.** On a gallery protected by a login, an unidentified visitor could still watch the indexer report which file it was working on and which ten came next — filenames included, whether or not those pictures were shared — start searches that put the machine to work, and fetch a prepared zip of original files. All six belong to the management screen and none is used by the visitor view, so nothing changes for guests.
* **The startup log now names the ffprobe actually in use.** The settings table shows the path you asked for; when nothing is there the gallery quietly uses whichever `ffprobe` it finds on your system instead, so the table could name a file that does not exist while everything worked — or name one that exists while nothing did. The log now states which tool was chosen, and if none was found it lists what stops working: video length and size, video thumbnails, waveforms, and prompt hiding for video.
* **An older copy of SmartGallery no longer mislabels a newer library.** If two versions shared one gallery folder — a container alongside a local copy, or a version you rolled back from — the older one quietly recorded the database as being at its own, earlier version, so the newer copy would redo work it had already done. The older copy now says plainly that the library belongs to a newer version and leaves the marker alone.
* **A first start no longer looks like an upgrade.** Creating a fresh library announced six schema updates and a version change, which read as though the install were already out of date. Those steps still happen; they are just no longer narrated on a database that was made seconds earlier. A genuine upgrade still says so.
* **One damaged image can no longer bring the gallery down.** How much memory an image needs is decided by the numbers in its header, not by its size on disk, so a few kilobytes claiming to be 65535×65535 asks for about 13GB — and the safety limit for that had been switched off entirely to make room for large upscales. There is now a generous limit instead: upscales up to roughly 22000×22000 are untouched, and anything beyond about 31000×31000 is skipped, costing that one file its thumbnail rather than the whole gallery.
* **A stuck video tool can no longer freeze the gallery.** ffmpeg and ffprobe stall on damaged files and on storage that stops answering, and nothing limited how long they were given — so one bad video could hold up a scan, a page, or even startup, with no error and nothing to point at. Each call now has a ceiling; passing it costs that one file its thumbnail or details, and everything else carries on.
* **A stalled model download gives up instead of waiting for ever.** If the server holding a model file accepted the connection and then went quiet — a stalled mirror, a captive portal, a firewall that swallows traffic rather than refusing it — the download waited indefinitely. Setup never finished and never failed, so the AI features simply never arrived and nothing said why. A minute of silence now ends the attempt so it can be retried; a slow connection is unaffected, since the clock resets whenever data arrives.
* **A misspelt setting name is pointed out at startup.** Getting a variable's name slightly wrong — `BASE_OUTPUT_PAT` for `BASE_OUTPUT_PATH` — meant it was never read at all: the gallery quietly used its default folder and looked as though it could not find your files. The console now names the variable and what it was probably meant to be. It only mentions names within a hair of a real one, so other programs' settings are left alone.
* **A mistyped AI setting no longer switches the AI features off.** `ENABLE_AI_DAM=ture` — or any other slip — was read as "no", so Similar, Faces, Review and the search palette all quietly disappeared, looking for all the world like the feature was broken. A value that is neither yes nor no now says so on the console and keeps the documented default. The same applied to `AI_DAM_AUTO_PROVISION` and `AI_DAM_EPHEMERAL_INDEX`.
* **A mistyped start-up option now stops the gallery instead of being ignored.** `--forcelogin`, or `--force-login` written with an underscore, was silently discarded — the gallery started with no login while you believed it was locked, and nothing on screen said otherwise. The same went for a misspelt `--exhibition` or `--blind-rating`. Unknown options now refuse to start and suggest what you meant.
* **Deleted files stay deleted when the trash is inside the gallery.** Pointing `DELETE_TO` at a folder within your gallery — the obvious choice if you want deletions to stay on the same drive — meant the next scan found them again and put them back, under a timestamped name, without the ratings and comments they had before. The trash folder is now left out of scanning wherever it is.
* **Closed a hole that let anyone read files from your gallery folder.** One address used for video storyboard frames took a folder name straight from the URL, so a request containing `..` reached the gallery folder itself and returned whatever was named — with no login, on a server started with `--force-login` or `--exhibition`. Anyone who could reach the gallery over the network could read pictures by name, past the login and past the prompt hiding. If your gallery has ever been reachable beyond your own machine, update.

* **Renaming a file now works.** Every rename previously failed with a server error, from both the toolbar and the <kbd>R</kbd> shortcut.
* **Uploads no longer overwrite.** Uploading a file whose name matched one already in the folder replaced it silently and still reported success. The arriving file is now saved alongside as `name(1).png`, matching what moving a file has always done.
* **Trash (`DELETE_TO`) is usable again.** Setting it prevented the app from starting unless its folder already existed — so the one setting that makes deletions recoverable could not be turned on.
* **Deleting a folder respects the trash.** With `DELETE_TO` set, folder deletion permanently destroyed everything inside instead of relocating it. Links and shortcuts are still only unlinked, never moved.
* **Thumbnails are never left half-written.** A full disk or an interrupted render could leave a truncated file that the gallery then served as that image forever.
* **Remix inputs no longer collide.** Two remixes of same-named source images overwrote each other's uploads, so a queued generation could render the wrong picture.

### 🐛 Fixes

* **The two-container Docker setup starts.** `compose-exhibit.yaml` read a password from `EXHIBITION_PASS` while the example at the bottom of the same file told you to set `EXHIBIT_PASS`. Following the file's own instructions therefore left the value empty, and the Exhibition container was launched with a `--admin-pass` that had nothing after it: it exited immediately and restarted for ever, and none of what it printed mentioned a password or a file to put one in. Both names now match, and a password that is missing or blank stops `docker compose up` with a line naming exactly which one to set.
* **Blind rating no longer sends the average to the rater.** With blind rating on, the screen correctly hid what everyone else had scored a picture — but the reply to each vote still contained the average, where it could be read from a browser's network tab. The figures are now withheld from anyone who is rating blind, and still sent to everyone else.
* **Searching by model now finds pictures made outside ComfyUI.** Images from A1111, Forge and similar tools were searchable by prompt but not by the checkpoint that made them: the Models box came back empty for them, even though the model was known and shown on the picture. They now record their checkpoint and any LoRAs the same way ComfyUI images do. Existing files pick this up on their next full scan; grouping by model is unchanged.
* **Searching by prompt works again.** Any prompt search from a folder view — including the `model:`, `seed:` and `steps:` filters — returned a server error, every time, for everyone. The same search from a collection worked, so the feature appeared to work or not depending on which page you were on.
* **Search ignores capitals in every language, not just English.** Searching `CAFÉ` found nothing while `café` found the file, and `РИСУНОК` never matched `рисунок` — so for anyone whose filenames are not plain English, search worked only if the capitals happened to match, and otherwise looked like an empty library.
* **Uploads keep filenames that are not written in English.** A Chinese, Korean or Cyrillic filename was stripped down to nothing usable — `测试.png` became `png`, which the gallery then refused as having no recognised type, so the upload failed with an error naming a file you had never seen. Japanese and accented names quietly lost characters instead. Names are now kept as they are, with only what is genuinely unsafe removed, and the same applies to images sent to Remix.

* **The Quality score in the AI panel was always full.** Every reviewed image displayed 100%, whatever it actually scored; a 3/10 and an 8/10 looked identical. Quality now reads `8.0 / 10` with a matching bar, and Prompt Following stays a percentage.
* **Your library is indexed even where parallel processing is unavailable.** On systems that cannot start worker processes the scan reported "completed" having indexed nothing, blaming file corruption. It now finishes the work one file at a time and says so.
* **Blank settings mean "use the default".** Clearing a value in `run_smartgallery.bat` (or a Docker/Unraid field) previously meant an empty value: a blank number stopped the app from starting at all, a blank `GENERATE_THUMBNAILS` silently disabled thumbnails, and a blank `ENABLE_AI_DAM` switched the whole AI layer off. A mistyped value now warns and falls back instead of failing.
* **ffprobe is verified.** Pointing `FFPROBE_MANUAL_PATH` at `ffmpeg.exe` — an easy slip, and what the template shipped — was accepted and then failed every video metadata read. The wrong tool is now detected and the system `PATH` is used instead.
* **Notifications moved off the toolbar.** Toasts appeared over the top-right buttons; they now rise from the bottom centre.
* **Private albums stay private on a login-protected gallery.** With `--force-login`, any signed-in account could list every album — including private ones and the names of the accounts each was shared with — and could open a private album to read what was in it, by name or through the combined "All" view. The pictures themselves were never reachable. Album visibility now depends on who is asking rather than on which mode the server was started in.
* **Opening an album in exhibition mode works.** Clicking any specific album returned a server error for visitors and staff alike; only the combined "all" view loaded. Album listings also carried each picture's prompt, model names and location on disk, which visitors are not meant to see — those are now left out.
* **Visitors can no longer start an AI review or a storyboard on your machine.** Both addresses could be called by anyone allowed to see the picture. A review occupied the AI model for minutes and streamed the prompt as it worked; a storyboard ran eleven video extractions per call, and a visitor could set that going for every video they could see. Both belong to the management screen and are now restricted to it. Video playback and audio waveforms are untouched — visitors need those.
* **AI reviews no longer quote the prompt back to visitors.** A review breaks the prompt into the things it asked for and marks each as delivered or missing, so the review itself contained the prompt in pieces — and it was readable by anyone allowed to see the picture. Visitors still get the quality score and the findings, which describe the image rather than the request; staff see the whole review.
* **Opening a picture no longer reveals its prompt to visitors.** The details shown alongside an image carried the prompt, the model names and the file's location on the server to anyone who could see the picture — undoing, in a single request, the prompt hiding applied everywhere else. Visitors still get the ratings, comments and albums; staff still see everything.
* **Grid thumbnails no longer leak prompts when thumbnail generation is off.** With server-side thumbnails switched off, the gallery serves the original picture and lets the browser shrink it — including to visitors, who then received the prompt for every tile on screen without opening a single one. Visitors now get a generated thumbnail regardless of that setting; it exists to save processing, which does not outrank the guarantee.
* **Exhibition mode no longer hands out prompts when it cannot strip them.** Hiding prompts and workflows from visitors depends on rewriting each file as it is served, and when that could not be done — most often a video on a machine with no ffmpeg — the original was sent instead, metadata and all, with only a note on the server console. The file is now withheld from visitors with an explanation of what to install; staff are unaffected and still get their originals.
* **Moving files keeps their ratings.** Moving a file that had been rated or commented on failed and reported itself as a partial success — while the file had already been moved on disk, so the entry pointed at the old folder and the next scan removed it, ratings and all. Moves now carry everything attached to the file, and a move that cannot complete leaves the file where it was.
* **Renaming works again once you have rated anything.** Renaming a file or a folder failed with a server error as soon as a single file involved had a rating or a comment — and the file was renamed on disk anyway, leaving the gallery pointing at the old name, so the next scan removed the entry and took its rating and comments with it. Ratings, comments, favourites and album membership now follow a file through a rename, and a rename that cannot complete changes nothing at all.
* **A gallery folder that is briefly unreachable no longer erases your library.** If the drive or network share holding your output was unplugged, asleep, or not yet remounted when a scan ran, every file was treated as deleted — and because ratings and comments belong to their file, all of them were destroyed along with it. The images returned with the drive; the ratings did not. A folder the gallery cannot read is now left untouched, and a folder it can read is cleaned up as before.
* **Deleting or unmounting a folder now clears everything inside it.** On Windows, files sitting in subfolders kept their gallery entries after the folder was gone — and ComfyUI writes into date-stamped subfolders by default, so most of a folder's images stayed on as entries whose thumbnails never load. Run a full scan once to clear any left from before.
* **Renaming a folder keeps its subfolders.** Files one level down were recorded as if they had moved to the top of the renamed folder, and a folder whose name merely started with the same text — `output_archive` next to `output` — had its files rewritten too.
* **Your own star ratings are findable again.** On a standard install with no login, ratings were saved under one identity and looked up under another, so **My Ratings Only** showed an empty gallery and the **Unrated** queue handed back images you had already rated. Existing ratings were never lost and reappear on their own — nothing to re-rate.

### ✨ Improvements

* **One AI surface per job.** The lightbox AI panel now answers only about the image you have open (Similar / Faces / Review). Everything gallery-wide — status, face clusters, duplicates, reviews, meaning search, detector compare — lives on the AI dashboard, and <kbd>Ctrl</kbd>+<kbd>P</kbd> is the search. Detector compare runs inside the panel instead of navigating away.
* **A calmer lightbox.** Opening an image showed twenty controls; it now shows five, with the rest in a labelled **⋯ More** menu. Every keyboard shortcut is unchanged.
* **Search understands file formats.** `pngs`, `jpgs`, `mp4s` and friends now filter by file type instead of being treated as words to search for — `3 star pngs from last week` works as written.

### **[2.21] - 2026-08-08**

### 🧬 Smart Asset Clustering & Visual Inspector

**What it does:**  
Smart Asset Clustering organizes your gallery into visual groups based on how your images were created. Instead of getting lost in thousands of generated files, it lets you instantly group and compare images that share either the same workflow pipeline or the same prompt text.

**The 2 Clustering Modes:**
1. **By Architecture (`workflow`):** Groups images created with the exact same workflow setup (node structure + model files), ignoring random seeds, steps, CFG, or prompt text changes. Perfect for comparing all variations produced by a specific pipeline.
2. **By Prompt Text (`prompt`):** Groups images that share the exact same prompt, even if you tested that prompt across different models, Flux/SDXL workflows, or settings.

**How to Use It:**
* **Quick Shortcut:** Focus or hover over any image in the gallery or Lightbox and press <kbd>Shift</kbd>+<kbd>C</kbd>.
* **Click Any Badge:** Click the colorful `#HASH` badge on any thumbnail card or inside the Details panel.
* **From Tools Menu:** Open the **🛠️ Tools** menu and click **🧬 Smart Clustering**.
* **Exit Clustering:** Press <kbd>ESC</kbd> anytime or click **✕ Exit Cluster Mode** on the top banner.

**Interactive Hash Inspector Modal:**  
Clicking any `#HASH` badge on a thumbnail card opens an **Inspector Panel** showing you:
* **The Visual Pipeline:** A sequence of color-coded chips showing the active node flow (e.g. `CheckpointLoader ➔ LoraLoader ➔ KSampler ➔ VAEDecode`).
* **Models Loaded:** The exact checkpoint and LoRA model files used.
* **Asset Prompt:** The prompt text of that image with a one-click **📋 Copy** button.
* **Cluster Stats:** How many other matching assets exist in your entire gallery.
* **One-Click Launch:** A **`🚀 Clusterize Gallery`** button that opens the clustering settings pre-targeted on that asset, letting you choose your scope (Global vs. Current Folder).

**Sub-Badges:**  
When clustering by Prompt, thumbnail badges display both the primary Prompt badge (`💬 #PROMPT`) and a secondary Architecture variant badge (`🧬 #ARCH`), letting you spot pipeline variations at a glance.

### **[2.16] - 2026-07-24**

### 📑 The New List View Experience
Sometimes a grid of thumbnails isn't enough when you need to analyze hard data. We are introducing a highly requested, fully responsive **List View** alternative to the standard Grid layout.
* **Instant Activation:** Seamlessly toggle between Grid and List layouts at any time directly from the **⚙️ Options** menu. 
* **High Data Density:** The fluid, squishy-column architecture displays everything at a glance: Index, Thumbnail Preview, Name, Rating, Comments, Size, Resolution (MP), Duration, Type, and Date. It scales perfectly without breaking, even if you zoom your browser up to 200%.
* **Sticky Sortable Header (Desktop):** The column header stays pinned at the top of the gallery as you scroll. Simply click on any column name to instantly sort your files by that specific metric.
* **Smart Mobile Sorting:** On smaller screens where the wide header cannot fit, it elegantly transforms into a compact dropdown menu, giving mobile users the exact same powerful sorting capabilities without sacrificing screen space.

### 📚 Virtual Collections Evolution
We took the hierarchical tree structure introduced in the last patch and supercharged it with smarter navigation, better filtering, and advanced permission management.
* **Fully Navigable Nested Trees:** Seamlessly browse, expand, and collapse deep hierarchies of sub-collections directly from the sidebar. 
* **Smart Permission Inheritance (🧬):** When creating a new nested sub-collection, you no longer need to manually re-configure its visibility. You can now choose to have it instantly inherit the exact Exhibition permissions (Public, Private, or Shared) from its direct **parent collection**.
* **Shared Users Tooltip:** Wondering who has access? In both the main workspace and the Exhibition portal (for administrators), simply hover over the purple "Shared" icon (👥) next to a collection name to reveal a tooltip listing exactly which users have permission to view it.
* **The `>0` Non-Empty Filter:** A new toggle in the collections toolbar allows you to instantly hide empty collections and cut through the noise. It features smart path preservation: parent folders with zero direct files will still remain visible if they contain populated sub-collections.
* **Smarter Badges:** Enhanced visual counters clearly distinguish between *Direct Counts* (files specifically tagged in that collection) and *Descendant Counts* (`+N`, showing unique files hidden inside collapsed child collections).
* **Audio File Support:** Audio files are now fully supported inside Virtual Collections. You can organize them and expose them to your clients via the Exhibition portal just like images and videos.

### 🛠️ Security & Quality of Life Fixes
* **Mobile Waveform Control:** You can now easily cycle through and manage audio/video waveform amplitudes directly from mobile devices.
* **Security Hardening:** General backend fixes to strengthen data isolation, user permission checks, and overall system security.

### 🔌 LoRA Synergy™
A zero-API, fully offline LoRA matchmaker and injector integrated directly into the Remix Nodepad. Stop guessing which LoRA works with your checkpoint.

### How to Access
* Press **B** on any file to enter the **Remix Workflow**.
* Select **Nodepad**.
* Find the new **LoRA Synergy** tab in purple at the right of the screen.

* **Offline Architecture Scanning:** Reads your local `.safetensors` headers to determine their true base architecture (SD1.5, SDXL, Flux) and instantly buckets them into compatibility groups against your loaded checkpoint.
* **Smart Trigger Memory:** Automatically surfaces official CivitAI trigger words and recalls historical triggers you've successfully used in the past via a floating clipboard widget.
* **Auto-Wiring:** Seamlessly injects `LoraLoader` nodes and instantly rewires all downstream `MODEL` and `CLIP` connections without manual rerouting. 
* **Seamless Integration:** Native synergy with `ComfyUI-Lora-Manager` to unlock rich preview thumbnails and CivitAI deep-links directly in the panel.

👉 For more detailed information, READ the **[LoRA Synergy MANUAL](https://github.com/biagiomaf/smart-comfyui-gallery/blob/main/docs/LORA_SYNERGY.md)**.

### **[2.14] - 2026-06-16**

### 🚀 Remix Workflow Overhaul & The { } Nodepad (Major Update)
The Remix feature has been completely rebuilt from the ground up. We retired the rigid "App View" and introduced a fluid, dynamic 3-tier workspace designed to give you absolute control over your generations, whether you want a quick tweak or deep structural modifications.

* **The 3-Tier Workspace Architecture:**
