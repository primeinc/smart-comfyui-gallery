# Changelog

### **[Unreleased]**

### 🛡️ Data Safety

* **Renaming a folder to a name ending in a full stop no longer loses its ratings.** Windows quietly removes a full stop from the end of a folder name when it creates it — `holiday.` becomes `holiday` — and the gallery went on recording the name you asked for. From then on it was looking for your pictures in a folder that does not exist, while the real one sat beside it. Nothing appeared wrong at the time; the rename reported success. The damage came at the next scan, which found pictures it had no record of and records whose pictures had gone, and discarded the records — and the ratings, comments and album membership attached to them. Folder names are now put through the same check the gallery already applied to file names, which knows about the characters Windows removes without telling you. A trailing space was already handled and still is; ordinary names, including names in any language, are untouched.
* **Another website can no longer make your gallery do things.** A page you happen to have open in another tab could send your gallery an instruction, and your browser would deliver it — including deleting a file or a whole folder. Nothing had to be guessed: the address of a folder is just its name written in a simple code, so a folder called `videos` is always the same address on every gallery. The other page could not read the reply, but it did not need to; the folder was gone. It applied even in the ordinary setup with no login, where there is no password to be missing. Browsers state which site started a request, and the gallery now refuses anything that changes something and says it came from elsewhere, with a message explaining why. Nothing about using the gallery normally changes: your own pages, links, bookmarks, and anything that is not a browser at all — scripts, other tools — are unaffected. Two limits worth knowing: this relies on the browser telling the truth about where a request came from, which browsers only do for a gallery reached at `localhost` or over `https`, so a gallery reached by its network address over plain `http` is not covered by it; and the login cookie is now marked so that browsers will not send it to another site, which applies everywhere but only matters in the modes that have a login.

* **Comments follow who may see the picture.** Reading and writing comments checked only that somebody was signed in, never whether they were allowed to see the picture the comments were about. So in Exhibition, anyone you had given a single album to could read your notes on **every other picture in your library** — including ones the gallery refuses to show them — and could attach comments of their own to any of them. Comments on a client's pictures are exactly where an owner writes about the client. **If you share collections, treat any note you have written on an unshared picture as having been readable.** Both are now refused, with the same answer as for a picture that does not exist.
* **A visitor can only rate pictures that were actually shared with them.** Rating checked that a picture existed, but never that the person was allowed to see it. So in Exhibition, somebody you had given access to one album could score any picture in your library — including ones the gallery refuses to show them — and the score was recorded. The average you saw on a private picture could have been set by someone who never laid eyes on it. **If you share collections with clients or friends, look over your ratings: a score may not have come from anyone who was shown the picture.** Rating a picture that was not shared is now refused, with the same answer as for a picture that does not exist, so the two cannot be told apart.
* **Favourites survive a rescan.** Marking a picture as a favourite was undone whenever the file's timestamp changed — and a timestamp changes for reasons that have nothing to do with the picture: restoring a backup, copying your library to another drive, a sync client rewriting files, a tool that rewrites metadata. Any of those emptied your Favourites in a single scan, with nothing said. It happened because the favourite was being cleared alongside the AI caption and search data, which genuinely do have to be recalculated when a file changes; your ratings, comments, albums and tags were never affected, because they are kept separately. Favourites are now treated the same way. Marks already lost cannot be recovered, but they will stay from here on.
* **A missing database is now announced instead of quietly replaced.** If `gallery_cache.sqlite` disappeared — quarantined by antivirus, lost to a sync conflict, or swept up by someone tidying a folder with "cache" in its name — nothing failed. A new empty one was created in its place, the pictures were scanned again, and the gallery came up looking like a fresh install. Your ratings, comments, albums, collections and tags lived in that file, and the first you knew was when you went looking for them. The gallery now recognises a folder that has held a library before and says so at startup, in time to stop and put a backup back. A genuinely new gallery folder is told nothing, as before.
* **Deleting a folder while the trash location is unavailable no longer hides it.** If you set `DELETE_TO` to a second drive or a network share and that drive was not connected, deleting a folder still said it had worked. It quietly rebuilt the trash folder at the same path — on your main disk, underneath where the drive normally appears — and moved your files there. As soon as the real drive was reconnected it covered them again, so the pictures were gone from the gallery, absent from the trash you would go looking in, and nothing had reported a problem. Deleting a single file happened to fail loudly in the same situation, which is why this only ever bit folders. Both now refuse while the trash cannot be reached, and nothing is moved.
* **Deleting works again after the trash folder is removed.** The gallery makes its `SmartGallery` folder inside `DELETE_TO` when it starts, and people empty that location — that is what it is for. Once the folder was gone every delete failed with "Failed to delete", giving no reason, until the next restart. It is now put back the moment something needs it.
* **The management screens can no longer be downloaded without signing in.** The gallery serves its own page files at a second address as well, and that address was never given a rule about who may ask for it — so on a server started with `--force-login`, or in Exhibition, anyone who knew the path could fetch the whole management interface, the user manager included, without ever logging in. No pictures, prompts, names or ratings came out that way: the files are the empty screens, not their contents, and every address that fills them in was already checked separately. What it did give away was the full shape of the management side to someone who is not supposed to see it exists. It is now refused unless you are signed in. Nothing changes for a gallery running locally without a login.
* **Docker: the admin password is no longer written to the container log.** On every start the container copies its settings between two internal accounts and announces each one as it goes. It hid values whose name looked like a secret — anything containing TOKEN, API or KEY — but the admin password is not passed under a name like that: the documented way to set it puts it inside `CLI_ARGS`, so it was printed in full, in a log that `docker logs` and any log collector can read. **If you run SmartGallery in Docker with a password, assume it is in your container logs and change it.** The password is now masked whether it arrives inside `CLI_ARGS` or in its own variable, exactly as the gallery already masked it in its own startup banner.
* **Docker: a password with spaces in it now works.** `CLI_ARGS` is split on spaces before it reaches the gallery, so a passphrase like `correct horse battery` arrived as `correct` — no error, and no way to log in with what you had set. Set the password with `ADMIN_PASSWORD` instead, as the README and the supplied compose file now do; nothing splits it.
* **The Exhibition launcher no longer ships with a password in it.** `sample_run_exhibition.bat` — the file whose own instructions tell you to rename it and run it — set the admin password to a word written into the file, and therefore the same word for everyone who downloaded SmartGallery. Exhibition is the mode you hand to family, friends and clients. **If you started Exhibition from that sample without changing the last line, treat that password as public and set your own now.** The sample now has an `ADMIN_PASSWORD` line near the top for you to fill in, and Exhibition refuses to start until you do, rather than falling back to anything. It also told you to rename it to `run_smartgallery.bat`, which would have replaced your main launcher; it now names `run_exhibition.bat`.

* **Account expiry dates now actually expire the account.** Setting an expiry on a visitor's account did nothing: the user manager showed it in red with an hourglass once the date passed, and the account went on signing in indefinitely. If you have ever given someone temporary access this way, they still have it — check your user list. Expired accounts are now refused with a message saying when they lapsed. Signing in as the administrator with the password from your launcher still works regardless, so you cannot lock yourself out.

* **The AI status report now requires sign-in.** It reports on the whole library, and the recent-error list quotes the location on disk of any file that failed processing — so on a gallery protected by a login, someone who never signed in could read folder paths out of it. It still reports while the AI features are switched off, which is how the panel knows to say so.
* **Comments and ratings can no longer be changed without signing in.** On a gallery protected by a login, deleting a comment, rewriting one, or setting and clearing ratings in bulk could all be done by someone who never signed in: those three checked whether the identity in the request matched the one on the record, but never checked that there was a caller at all. Comments are numbered in order, so they could simply be counted through. Posting a comment and rating a single picture were never affected.
* **Two more management addresses now require sign-in.** One of them re-scanned a folder on request — writing to the library and naming each file as it went — for anyone who asked, without signing in. The other listed every album, private ones included, together with the full names of the people each was shared with. Both belong to the management screen; the visitor view never used either.
* **Six addresses that answered anybody now require sign-in.** On a gallery protected by a login, an unidentified visitor could still watch the indexer report which file it was working on and which ten came next — filenames included, whether or not those pictures were shared — start searches that put the machine to work, and fetch a prepared zip of original files. All six belong to the management screen and none is used by the visitor view, so nothing changes for guests.
* **The startup log now names the ffprobe actually in use.** The settings table shows the path you asked for; when nothing is there the gallery quietly uses whichever `ffprobe` it finds on your system instead, so the table could name a file that does not exist while everything worked — or name one that exists while nothing did. The log now states which tool was chosen, and if none was found it lists what stops working: video length and size, video thumbnails, waveforms, and prompt hiding for video.
* **An older copy of SmartGallery no longer mislabels a newer library.** If two versions shared one gallery folder — a container alongside a local copy, or a version you rolled back from — the older one quietly recorded the database as being at its own, earlier version, so the newer copy would redo work it had already done. The older copy now says plainly that the library belongs to a newer version and leaves the marker alone.
* **A first start no longer looks like an upgrade.** Creating a fresh library announced six schema updates and a version change, which read as though the install were already out of date. Those steps still happen; they are just no longer narrated on a database that was made seconds earlier. A genuine upgrade still says so.
* **One damaged image can no longer bring the gallery down.** How much memory an image needs is decided by the numbers in its header, not by its size on disk, so a few kilobytes claiming to be 65535×65535 asks for about 13GB — and the safety limit for that had been switched off entirely to make room for large upscales. There is now a generous limit instead: upscales up to roughly 22000×22000 are untouched, and anything beyond about 31000×31000 is skipped, costing that one file its thumbnail rather than the whole gallery.
* **A stuck video tool can no longer freeze the gallery.** ffmpeg and ffprobe stall on damaged files and on storage that stops answering, and nothing limited how long they were given — so one bad video could hold up a scan, a page, or even startup, with no error and nothing to point at. Each call now has a ceiling; passing it costs that one file its thumbnail or details, and everything else carries on.
* **A stalled model download gives up instead of waiting for ever.** If the server holding a model file accepted the connection and then went quiet — a stalled mirror, a captive portal, a firewall that swallows traffic rather than refusing it — the download waited indefinitely. Setup never finished and never failed, so the AI features simply never arrived and nothing said why. A minute of silence now ends the attempt so it can be retried; a slow connection is unaffected, since the clock resets whenever data arrives.
* **A misspelt setting name is pointed out at startup.** Getting a variable's name slightly wrong — `BASE_OUTPUT_PAT` for `BASE_OUTPUT_PATH` — meant it was never read at all: the gallery quietly used its default folder and looked as though it could not find your files. The console now names the variable and what it was probably meant to be. It only mentions names within a hair of a real one, so other programs' settings are left alone.
* **A mistyped AI setting no longer switches the AI features off.** `ENABLE_AI_DAM=ture` — or any other slip — was read as "no", so Similar, Faces, Review and the search palette all quietly disappeared, looking for all the world like the feature was broken. A value that is neither yes nor no now says so on the console and keeps the documented default. The same applied to `AI_DAM_AUTO_PROVISION` and `AI_DAM_EPHEMERAL_INDEX`.
* **A mistyped start-up option now stops the gallery instead of being ignored.** `--forcelogin`, or `--force-login` written with an underscore, was silently discarded — the gallery started with no login while you believed it was locked, and nothing on screen said otherwise. The same went for a misspelt `--exhibition` or `--blind-rating`. Unknown options now refuse to start and suggest what you meant.
* **Deleted files stay deleted when the trash is inside the gallery.** Pointing `DELETE_TO` at a folder within your gallery — the obvious choice if you want deletions to stay on the same drive — meant the next scan found them again and put them back, under a timestamped name, without the ratings and comments they had before. The trash folder is now left out of scanning wherever it is.
* **Closed a hole that let anyone read files from your gallery folder.** One address used for video storyboard frames took a folder name straight from the URL, so a request containing `..` reached the gallery folder itself and returned whatever was named — with no login, on a server started with `--force-login` or `--exhibition`. Anyone who could reach the gallery over the network could read pictures by name, past the login and past the prompt hiding. If your gallery has ever been reachable beyond your own machine, update.

* **Renaming a file now works.** Every rename previously failed with a server error, from both the toolbar and the <kbd>R</kbd> shortcut.
* **Uploads no longer overwrite.** Uploading a file whose name matched one already in the folder replaced it silently and still reported success. The arriving file is now saved alongside as `name(1).png`, matching what moving a file has always done.
* **Trash (`DELETE_TO`) is usable again.** Setting it prevented the app from starting unless its folder already existed — so the one setting that makes deletions recoverable could not be turned on.
* **Deleting a folder respects the trash.** With `DELETE_TO` set, folder deletion permanently destroyed everything inside instead of relocating it. Links and shortcuts are still only unlinked, never moved.
* **Thumbnails are never left half-written.** A full disk or an interrupted render could leave a truncated file that the gallery then served as that image forever.
* **Remix inputs no longer collide.** Two remixes of same-named source images overwrote each other's uploads, so a queued generation could render the wrong picture.

### 🐛 Fixes

* **The thumbnail folder gives space back now.** Each thumbnail is filed under the picture it came from and the moment that picture was last written, and nothing ever removed one. Deleting a picture left its thumbnail behind for good. So did anything that changed a file's date — an edit, a sync tool, re-saving — because that counts as a different picture and the earlier thumbnail is never asked for again. Six pictures, browsed once, then three deleted and one edited, left seven thumbnails for three files, and no way for that number to come down. On a library of any size, and in a folder that sits alongside it, that adds up quietly. The gallery now clears the ones nothing refers to when it starts, just after it checks the library against your disk — which is the only moment it can tell the difference. Anything it cannot positively recognise as a thumbnail is left where it is, and if the library reads as empty it removes nothing at all.
* **A model download that gets cut off now says so, and cleans up after itself.** Setting up the AI features downloads files ranging from a few hundred megabytes upwards, so a transfer being interrupted is an ordinary thing rather than a rare one — and an interrupted transfer does not report itself as one. The download simply ended, and however much had arrived was treated as the finished file. For the files that carry a published fingerprint, or that come from Hugging Face, this was already caught. For the rest it was noticed only later and further along, as a complaint that the file was not the right kind of file — which sends you looking for a bad address rather than simply retrying. It now checks that as many bytes arrived as the server said it was sending, and tells you how much is missing. Partly-downloaded files are also removed rather than left sitting in your models folder, where nothing ever looked for them again.
* **Building the Docker image from a Windows download now produces a container that starts.** Git on Windows is set up by default to rewrite line endings when it copies files onto your disk, and the repository never said which files must not be rewritten. The startup script that runs inside the container was therefore rewritten, and its very first line — the one naming the program that runs it — ended up with an invisible extra character on the end. Linux then looked for a program by that name, did not find one, and the container failed to start, with an error mentioning a file that plainly exists. Anyone building the image on Windows hit it; anyone on Linux or a Mac did not, which is why it could go unnoticed. The repository now states which files need which line endings, so both the container script and the Windows launcher files are correct however you obtained them. No file content changed.
* **Starting the gallery with `nohup` so it survives your terminal now works.** Running a gallery on a machine you connect to over SSH usually means starting it with `nohup ... &`, which works by telling the system to ignore the signal sent when your session ends. The gallery then replaced that instruction with one of its own — the handler that stops it — so the gallery shut down the moment you logged out, which is the exact thing `nohup` was there to prevent. It now leaves alone any signal that whoever started it has already chosen to ignore, and takes the others as before. Closing a terminal window you started it in normally still stops it, and Ctrl+C still stops it.
* **Prepared downloads are cleared properly, and are not offered once they are gone.** Preparing a download writes a zip holding a second copy of everything in it, into your gallery folder, and it is meant to be cleared after a day. The clearing only ever happened at the end of preparing another one — so if you prepared a download and never prepared another, that copy stayed on your disk indefinitely, which for a selection of videos is a lot of space in a folder people often have synced. It is now also cleared when the gallery starts, which every gallery does. The other half of the same fault: when a download did get cleared, the gallery still had it listed as ready and would still offer you the link, which then failed with a browser error page. It now checks that the file is actually there before offering it, and otherwise says the download has expired and to prepare it again.
* **Downloading a selection now gives you every file in it.** Files went into the zip under their own names, and ComfyUI numbers its output separately in each folder — so `ComfyUI_00001_.png` exists once in every folder you have. Selecting pictures from more than one folder therefore put several files into the zip under one name, and opening it kept only the last of them. Selecting three such files produced a zip that unpacked to one picture. Nothing warned you: the download was prepared, reported as ready, and arrived. Where a name is shared, each copy now carries the folder it came from — `ComfyUI_00001_ (portraits).png` — and every file you picked is in there. A download from a single folder is exactly as it was, names included.
* **Browsing a large library no longer piles up memory until the gallery stops.** Each time the gallery draws a view it keeps that view's file list to hand, so that scrolling for more can continue where the page left off, and it kept the last thirty-two of them. What it never accounted for is that one of those lists holds a row for every file in the view — and a view can be your whole library. Measured at about 2.2 KB per file, a library of 50,000 renders reached roughly 3.4 GB after browsing thirty-two views, and 200,000 files reached far past anything a machine would give it. Nothing about it looked like browsing: the gallery simply grew until it became unresponsive or was killed. There is now a limit on the total held, not just on how many are kept, so a large library keeps fewer at a time. The view you are looking at is always kept, whatever its size, and an older one being dropped just means that tab reloads its list, which it already did.
* **AI indexing no longer quietly skips files while a scan is running.** The AI layer stores what it learns in the gallery's own database, so while a scan is writing to it the indexer has to wait its turn. It was only willing to wait five seconds. A scan of a large library holds the database for longer than that on a single batch, and when the wait ran out the indexer treated it exactly as it treats a file it cannot read: it moved on. Nothing was reported, because nothing had gone wrong as far as it could tell — the files were simply never indexed, and they would only be picked up if something later marked them as needing another look. It shows up on big libraries and slow disks and on no others, which is why it could go unnoticed. Every part of the AI layer now waits as long as the gallery itself does.
* **Restarting after a crash no longer reports the port as taken when it is not.** Before starting, the gallery checks that its port is free, and it was doing that check more strictly than the server it then hands the port to. On Linux and macOS a port that was serving connections when the previous run died stays briefly unavailable to an ordinary check while remaining perfectly usable by the server — so the gallery announced "PORT ALREADY IN USE", told you to pick another port, and waited for a keypress, over a port that would have worked. The check now asks for the port on exactly the same terms the server does, so the two cannot disagree. A port genuinely in use by another program is still refused, as before.
* **A file with a Chinese, Japanese, Korean or Cyrillic name can no longer stop the gallery starting.** When the gallery has something to report about a particular file — it is damaged, its folder cannot be read, the drive it lives on has gone — it says so by name. If its output was going to a log file or to whatever started it, rather than to a console window, Windows encodes that output with the machine's regional code page, which cannot hold those characters at all. The message then failed instead of printing, and took the whole process down with it: a scan that is deliberately built so one damaged file costs only that file was being ended by the line reporting it. On a library holding one such file, the gallery did not finish starting. Its output now carries any name, and a name it somehow cannot show comes out marked rather than fatal.
* **Raising the upload limit above 2 GB now actually raises it.** `COMFYUI_MAX_UPLOAD_MB` set the gallery's own limit, but the web server underneath it had a fixed ceiling of 2048 MB written in, and it refuses a request before the gallery ever sees it. So a gallery configured to accept 4 GB accepted 2048 MB, and the upload failed with a number that matched nothing you had set — which mattered most for video, where a single clip in an editing format passes 2 GB easily. The server's ceiling now follows the setting. If a file really is over the limit, the message says so and names the limit, instead of the screen showing only "413".
* **Telling the gallery where ComfyUI is now works in the browser too.** `COMFYUI_SERVER_URL` is for anyone whose ComfyUI is not at `http://127.0.0.1:8188` — a second instance on another port, a machine on the network, or the Docker setup. The gallery itself honoured it and printed it at startup, but the page did not: eight places had the address written into them, so Tools → Open ComfyUI opened a dead tab, the LoRA Manager button never appeared at all because the check for it went to the wrong place, LoRA links in the metadata panel led nowhere, and the Remix help text stated the wrong address as fact. Nothing said anything was wrong; the feature simply looked absent. The address is now sent to the page, and everything uses that one copy. Typing a different address into Remix still overrides it for that job and is still remembered, as before.
* **One unplayable video can no longer bring the whole gallery to a halt.** Playing a video converts it as it goes, and the converter can stop dead on a damaged or half-written file, or on a drive or network share that stops answering. When it did, it produced nothing and never gave up, and the gallery sat waiting on it with no error, no timeout and nothing in the console. That wait occupies one of the connections the gallery answers with, so a few attempts at the same bad file — a browser retrying on its own is enough — used them all up, and the whole gallery stopped loading for everybody until it was restarted. Playback now gives up if a minute passes with nothing coming through, and says which file in the console. A long video is unaffected: the limit is on silence, not on length, so a film plays for as long as it plays.
* **A link in a collection note can only go somewhere ordinary.** Notes are written as Markdown and shown to whoever the collection is shared with. A link's address was used exactly as written, so a note could contain a link that ran something when clicked rather than taking you anywhere. Typed-out HTML in a note was already shown as plain text and still is; it was only the address of a link or an image that went unchecked. Ordinary links — web addresses, email addresses, and links within the note — are unaffected.
* **`seed:`, `model:`, `steps:` and the other typed searches work inside an album.** Searching a folder for `seed:12345` found the picture; the identical search inside an album came back empty. Nothing failed and nothing was reported — an empty result reads as "there are none of those in here", so there was no reason to suspect the search rather than the album. The same applied to `model:`, `steps:`, `cfg:`, `sampler:`, `scheduler:`, `tool:` and `neg:`. Folder and album searching now share one piece of code, so a search added to one arrives in both.
* **Searching from inside an album shows the results.** If you opened the search palette while looking at an album and ran a search, the album simply reappeared, unchanged, with no results and nothing to say a search had happened — it looked as though the button did nothing. The search had run; it was being handed to the album screen, which has no way to display a list of files gathered from across the library. Results now open in the main gallery, the same as when you search from a folder. Going to an album normally is unaffected.
* **Sorting by name no longer puts every capital letter first.** The gallery ordered files the way a computer compares raw text, so everything starting with a capital came before everything starting with a small letter: `IMG_001.png` and `img_002.png` — two pictures from the same session — ended up with unrelated files between them. It is not only an English problem, but it affected English folders too, because ComfyUI writes one capitalisation and people type another. Sorting now ignores capitals, in every alphabet, and matches the folder list and the search results, which always did. Collection lists are sorted the same way. Accented letters still come after Z; putting them where a reader would expect needs proper alphabetical rules for each language and is not part of this.
* **A filename can no longer be treated as part of the page.** The grid put each file's name straight into the page as it built the thumbnails and the list view, so a file named with characters that mean something in a web page — `<`, `>`, `"` — was read as part of the page rather than shown as a name. On Linux, which is what the Docker version runs, those characters are perfectly legal in a filename, and the gallery indexes whatever appears in your output folder: anything writing there, including a custom node naming its own output, could put instructions into the screen you were looking at. Collection names were handled the same way. Names are now always shown as text, wherever they appear.
* **Workflow templates and collections with an apostrophe in the name work again.** In the Remix workflow library, Select, Rename and Delete all did nothing for any template named like `Bob's workflow` — the name was prepared for being shown as text rather than for being handed to a button, which looks the same and is not. Pinning a node whose label contained an apostrophe failed the same way, as did collection buttons for names containing a backslash. All of them now use the same preparation as the folder menu below.
* **Editing a user says what went wrong.** Renaming someone to a username already in use, or picking a role the gallery does not recognise, failed with a server error carrying no message at all — so the screen had nothing to show and no way to tell you the name was taken. Creating a user had always reported this properly; only editing did not. Both now say it plainly, in words rather than by quoting the database, and the account is left exactly as it was.
* **A folder with an apostrophe in its name has a working menu again.** Rename, Delete and Unmount did nothing at all for any folder whose name contained an apostrophe — `Bob's renders` and the like — because the name was placed straight into the button without being prepared for it, and the apostrophe ended the instruction early. A name containing a double quote was worse: it could add something of its own to the page, which is someone else's code running in your browser. Names are now prepared properly wherever they are handed to a button, in the folder menu and in the reply link on comments.
* **Saved prompts, saved queries and workflow templates keep the names you give them.** If you named one in Chinese, Japanese, Korean or Cyrillic — or simply used a German name with an umlaut — the name was stripped down to nothing before it was stored. Every such prompt ended up in the same file, so each one you saved silently replaced the one before it, while the screen said "Prompt saved" each time. The list then showed them as `txt`, and none of them could be opened again. Workflow templates behaved the same way. Names are now kept as typed, and each item is its own file. Items already overwritten cannot be recovered.
* **Source images from the ComfyUI input folder display again.** Two kinds were never shown. Any input image whose name is not written in plain English — Chinese, Japanese, Korean, Cyrillic, or simply a German name with an umlaut — came back as missing, because the name was being stripped down before the file was looked for; the same fault that was fixed for uploads. And every image ComfyUI itself puts in its `clipspace` folder — which is where a pasted or masked image goes — was missing too, for everyone, whatever language they use. Both are served correctly now, and nothing outside the input folder can be reached, which is checked from several directions.
* **Losing the thumbnails folder no longer costs you the rest of the session.** The gallery makes `.thumbnails_cache` when it starts and then takes for granted that it is still there. It has the word cache in its name and it sits wherever you pointed the gallery folder — often a synced folder or a second drive — so disk cleaners and tidy-up tools remove it. From that moment every thumbnail failed until the next restart, and the only sign was a line per file in the console naming a temporary file rather than the folder that had gone. It is now put back as soon as something needs it, and the console says so once instead of complaining about every picture. It is only ever put back inside a gallery folder that is still there: if the drive itself is missing, nothing is created in its place.
* **The two-container Docker setup starts.** `compose-exhibit.yaml` read a password from `EXHIBITION_PASS` while the example at the bottom of the same file told you to set `EXHIBIT_PASS`. Following the file's own instructions therefore left the value empty, and the Exhibition container was launched with a `--admin-pass` that had nothing after it: it exited immediately and restarted for ever, and none of what it printed mentioned a password or a file to put one in. Both names now match, and a password that is missing or blank stops `docker compose up` with a line naming exactly which one to set.
* **Blind rating no longer sends the average to the rater.** With blind rating on, the screen correctly hid what everyone else had scored a picture — but the reply to each vote still contained the average, where it could be read from a browser's network tab. The figures are now withheld from anyone who is rating blind, and still sent to everyone else.
* **Searching by model now finds pictures made outside ComfyUI.** Images from A1111, Forge and similar tools were searchable by prompt but not by the checkpoint that made them: the Models box came back empty for them, even though the model was known and shown on the picture. They now record their checkpoint and any LoRAs the same way ComfyUI images do. Existing files pick this up on their next full scan; grouping by model is unchanged.
* **Searching by prompt works again.** Any prompt search from a folder view — including the `model:`, `seed:` and `steps:` filters — returned a server error, every time, for everyone. The same search from a collection worked, so the feature appeared to work or not depending on which page you were on.
* **Search ignores capitals in every language, not just English.** Searching `CAFÉ` found nothing while `café` found the file, and `РИСУНОК` never matched `рисунок` — so for anyone whose filenames are not plain English, search worked only if the capitals happened to match, and otherwise looked like an empty library.
* **Uploads keep filenames that are not written in English.** A Chinese, Korean or Cyrillic filename was stripped down to nothing usable — `测试.png` became `png`, which the gallery then refused as having no recognised type, so the upload failed with an error naming a file you had never seen. Japanese and accented names quietly lost characters instead. Names are now kept as they are, with only what is genuinely unsafe removed, and the same applies to images sent to Remix.

* **The Quality score in the AI panel was always full.** Every reviewed image displayed 100%, whatever it actually scored; a 3/10 and an 8/10 looked identical. Quality now reads `8.0 / 10` with a matching bar, and Prompt Following stays a percentage.
* **Your library is indexed even where parallel processing is unavailable.** On systems that cannot start worker processes the scan reported "completed" having indexed nothing, blaming file corruption. It now finishes the work one file at a time and says so.
* **Blank settings mean "use the default".** Clearing a value in `run_smartgallery.bat` (or a Docker/Unraid field) previously meant an empty value: a blank number stopped the app from starting at all, a blank `GENERATE_THUMBNAILS` silently disabled thumbnails, and a blank `ENABLE_AI_DAM` switched the whole AI layer off. A mistyped value now warns and falls back instead of failing.
* **ffprobe is verified.** Pointing `FFPROBE_MANUAL_PATH` at `ffmpeg.exe` — an easy slip, and what the template shipped — was accepted and then failed every video metadata read. The wrong tool is now detected and the system `PATH` is used instead.
* **Notifications moved off the toolbar.** Toasts appeared over the top-right buttons; they now rise from the bottom centre.
* **Private albums stay private on a login-protected gallery.** With `--force-login`, any signed-in account could list every album — including private ones and the names of the accounts each was shared with — and could open a private album to read what was in it, by name or through the combined "All" view. The pictures themselves were never reachable. Album visibility now depends on who is asking rather than on which mode the server was started in.
* **Opening an album in exhibition mode works.** Clicking any specific album returned a server error for visitors and staff alike; only the combined "all" view loaded. Album listings also carried each picture's prompt, model names and location on disk, which visitors are not meant to see — those are now left out.
* **Visitors can no longer start an AI review or a storyboard on your machine.** Both addresses could be called by anyone allowed to see the picture. A review occupied the AI model for minutes and streamed the prompt as it worked; a storyboard ran eleven video extractions per call, and a visitor could set that going for every video they could see. Both belong to the management screen and are now restricted to it. Video playback and audio waveforms are untouched — visitors need those.
* **AI reviews no longer quote the prompt back to visitors.** A review breaks the prompt into the things it asked for and marks each as delivered or missing, so the review itself contained the prompt in pieces — and it was readable by anyone allowed to see the picture. Visitors still get the quality score and the findings, which describe the image rather than the request; staff see the whole review.
* **Opening a picture no longer reveals its prompt to visitors.** The details shown alongside an image carried the prompt, the model names and the file's location on the server to anyone who could see the picture — undoing, in a single request, the prompt hiding applied everywhere else. Visitors still get the ratings, comments and albums; staff still see everything.
* **Grid thumbnails no longer leak prompts when thumbnail generation is off.** With server-side thumbnails switched off, the gallery serves the original picture and lets the browser shrink it — including to visitors, who then received the prompt for every tile on screen without opening a single one. Visitors now get a generated thumbnail regardless of that setting; it exists to save processing, which does not outrank the guarantee.
* **Exhibition mode no longer hands out prompts when it cannot strip them.** Hiding prompts and workflows from visitors depends on rewriting each file as it is served, and when that could not be done — most often a video on a machine with no ffmpeg — the original was sent instead, metadata and all, with only a note on the server console. The file is now withheld from visitors with an explanation of what to install; staff are unaffected and still get their originals.
* **Moving files keeps their ratings.** Moving a file that had been rated or commented on failed and reported itself as a partial success — while the file had already been moved on disk, so the entry pointed at the old folder and the next scan removed it, ratings and all. Moves now carry everything attached to the file, and a move that cannot complete leaves the file where it was.
* **Renaming works again once you have rated anything.** Renaming a file or a folder failed with a server error as soon as a single file involved had a rating or a comment — and the file was renamed on disk anyway, leaving the gallery pointing at the old name, so the next scan removed the entry and took its rating and comments with it. Ratings, comments, favourites and album membership now follow a file through a rename, and a rename that cannot complete changes nothing at all.
* **A gallery folder that is briefly unreachable no longer erases your library.** If the drive or network share holding your output was unplugged, asleep, or not yet remounted when a scan ran, every file was treated as deleted — and because ratings and comments belong to their file, all of them were destroyed along with it. The images returned with the drive; the ratings did not. A folder the gallery cannot read is now left untouched, and a folder it can read is cleaned up as before.
* **Deleting or unmounting a folder now clears everything inside it.** On Windows, files sitting in subfolders kept their gallery entries after the folder was gone — and ComfyUI writes into date-stamped subfolders by default, so most of a folder's images stayed on as entries whose thumbnails never load. Run a full scan once to clear any left from before.
* **Renaming a folder keeps its subfolders.** Files one level down were recorded as if they had moved to the top of the renamed folder, and a folder whose name merely started with the same text — `output_archive` next to `output` — had its files rewritten too.
* **Your own star ratings are findable again.** On a standard install with no login, ratings were saved under one identity and looked up under another, so **My Ratings Only** showed an empty gallery and the **Unrated** queue handed back images you had already rated. Existing ratings were never lost and reappear on their own — nothing to re-rate.

### ✨ Improvements

* **One AI surface per job.** The lightbox AI panel now answers only about the image you have open (Similar / Faces / Review). Everything gallery-wide — status, face clusters, duplicates, reviews, meaning search, detector compare — lives on the AI dashboard, and <kbd>Ctrl</kbd>+<kbd>P</kbd> is the search. Detector compare runs inside the panel instead of navigating away.
* **A calmer lightbox.** Opening an image showed twenty controls; it now shows five, with the rest in a labelled **⋯ More** menu. Every keyboard shortcut is unchanged.
* **Search understands file formats.** `pngs`, `jpgs`, `mp4s` and friends now filter by file type instead of being treated as words to search for — `3 star pngs from last week` works as written.

### **[2.21] - 2026-08-08**

### 🧬 Smart Asset Clustering & Visual Inspector

**What it does:**  
Smart Asset Clustering organizes your gallery into visual groups based on how your images were created. Instead of getting lost in thousands of generated files, it lets you instantly group and compare images that share either the same workflow pipeline or the same prompt text.

**The 2 Clustering Modes:**
1. **By Architecture (`workflow`):** Groups images created with the exact same workflow setup (node structure + model files), ignoring random seeds, steps, CFG, or prompt text changes. Perfect for comparing all variations produced by a specific pipeline.
2. **By Prompt Text (`prompt`):** Groups images that share the exact same prompt, even if you tested that prompt across different models, Flux/SDXL workflows, or settings.

**How to Use It:**
* **Quick Shortcut:** Focus or hover over any image in the gallery or Lightbox and press <kbd>Shift</kbd>+<kbd>C</kbd>.
* **Click Any Badge:** Click the colorful `#HASH` badge on any thumbnail card or inside the Details panel.
* **From Tools Menu:** Open the **🛠️ Tools** menu and click **🧬 Smart Clustering**.
* **Exit Clustering:** Press <kbd>ESC</kbd> anytime or click **✕ Exit Cluster Mode** on the top banner.

**Interactive Hash Inspector Modal:**  
Clicking any `#HASH` badge on a thumbnail card opens an **Inspector Panel** showing you:
* **The Visual Pipeline:** A sequence of color-coded chips showing the active node flow (e.g. `CheckpointLoader ➔ LoraLoader ➔ KSampler ➔ VAEDecode`).
* **Models Loaded:** The exact checkpoint and LoRA model files used.
* **Asset Prompt:** The prompt text of that image with a one-click **📋 Copy** button.
* **Cluster Stats:** How many other matching assets exist in your entire gallery.
* **One-Click Launch:** A **`🚀 Clusterize Gallery`** button that opens the clustering settings pre-targeted on that asset, letting you choose your scope (Global vs. Current Folder).

**Sub-Badges:**  
When clustering by Prompt, thumbnail badges display both the primary Prompt badge (`💬 #PROMPT`) and a secondary Architecture variant badge (`🧬 #ARCH`), letting you spot pipeline variations at a glance.

### 🪄 Experimental Remix Workflow (New!)
* **Zero-UI Background Generation:** Tweak prompts, modify parameters, or randomize seeds and submit jobs directly to ComfyUI without ever opening the ComfyUI web canvas. Once generated, the new file instantly and automatically appears indexed inside your gallery.
* **Instant Shortcut Activation:** Trigger the Remix panel instantly for any focused image or video directly from the gallery grid by pressing **"B"** on your keyboard (or by clicking the magical wand 🪄 icon).
* **Dynamic Parameter & Prompt Extraction:** Automatically traces the workflow graph to extract text prompts (positive, negative, system), seeds, and key generation variables (Steps, CFG, Denoise, Resolution, etc.) into a clean, human-readable panel.
* **Source Image Swapping:** Easily replace input/source images directly from the form, supporting Image-to-Image, ControlNet, and IP-Adapter nodes.
* **Multi-Gen Batching:** Queue up to 100 generations in one click. Toggle the **Random Seed** option to ensure each background iteration produces a fresh variation instead of being skipped by ComfyUI's duplicate cache.
* **Flexible Manual Exports (Copy / Download):** Don't want to queue directly via API? Instantly **Copy** the modified JSON to your clipboard or **Download** it as a file. Pasting or importing it manually into the ComfyUI canvas will perfectly preserve all your parameter edits and input image swaps on the workspace.
* **High-Performance Architecture (Error 134 & 413 Resolution):** Complete structural refactoring of the submission workflow. The server now reads, modifies, and streams huge workflow files (100MB+) directly on local disk via `file_id` and binary Blob streaming. This entirely bypasses browser string memory crashes and proxy payload limitations (like Nginx `client_max_body_size`).
* **Intelligent Autofix & Interactive Corrections:** Translates standard UI-format JSON graphs into execution-ready ComfyUI API formats. If ComfyUI rejects the workflow due to validation errors (e.g., missing custom models or sampler mismatches), the panel guides you through interactive choice dropdowns to correct them.
* **Video Companion Sync:** Automatically detects video sidecar metadata files (such as `.png` companion files saved by VHS nodes) so you can remix prompt workflows directly from your video player card.
* **⚠️ Pragmatic "Quick & Dirty" Honest Disclaimer:** Despite major technical efforts, this remains an *experimental* and *stateless helper tool* designed for rapid iterations. It is **not** a replacement for ComfyUI's full native node canvas. It simply lets you edit the variables it successfully intercepts. If you use highly complex workflows, the system might find it harder to accurately capture all parameters and/or label them correctly; however, for standard, medium-to-simple workflows, it is an incredibly useful time-saver. If a workflow fails to map, no worries: it just means it's time to open the full ComfyUI canvas.
